# synthesis_orchestrator/Cargo.toml
# Professional Elite Implementation - Complete Dependencies

[package]
name = "synthesis_orchestrator"
version = "0.1.0"
edition = "2021"
authors = ["BIZRA Lab <m.beshr@bizra.info>"]
description = "Professional Elite Synthesis Orchestrator with Ihsan Excellence"
license = "MIT"

# ═══════════════════════════════════════════════════════════════════════
# FEATURES: Opt-in Performance & Platform-Specific
# ═══════════════════════════════════════════════════════════════════════

[features]
# Default: Portable SIMD only
default = ["simd"]

# SIMD optimizations (portable, works on most platforms)
simd = ["dep:simd-json"]

# AVX2 (x86_64 only, Intel Haswell+ / AMD Excavator+)
avx2 = []

# AVX512 (x86_64 only, Intel Skylake-X+, requires nightly)
avx512 = []

# io_uring (Linux only, kernel 5.1+)
io-uring = ["dep:io-uring"]

# ═══════════════════════════════════════════════════════════════════════
# CORE DEPENDENCIES (Always Required)
# ═══════════════════════════════════════════════════════════════════════

[dependencies]
# Collections & Data Structures
hashbrown = "0.15"
bytes = "1.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SIMD JSON Parsing (optional, enabled by default)
simd-json = { version = "0.13", optional = true }

# Async Runtime
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }

# Randomness & Distributions
rand = "0.8"
rand_distr = "0.4"

# Cryptography
ring = "0.17"        # Ed25519 signing
blake3 = "1.5"       # BLAKE3 hashing
hex = "0.4"          # Hex encoding

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Feature Gating
cfg-if = "1.0"

# Logging
tracing = "0.1"

# ═══════════════════════════════════════════════════════════════════════
# PLATFORM-SPECIFIC DEPENDENCIES
# ═══════════════════════════════════════════════════════════════════════

[target.'cfg(all(target_os = "linux"))'.dependencies]
io-uring = { version = "0.6", optional = true }

# ═══════════════════════════════════════════════════════════════════════
# DEV DEPENDENCIES (Testing & Benchmarking)
# ═══════════════════════════════════════════════════════════════════════

[dev-dependencies]
criterion = "0.5"
tokio-test = "0.4"
proptest = "1.5"

# ═══════════════════════════════════════════════════════════════════════
# BENCHMARKS
# ═══════════════════════════════════════════════════════════════════════

[[bench]]
name = "json_parsing"
harness = false

[[bench]]
name = "scoring"
harness = false

[[bench]]
name = "consensus"
harness = false
