# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  BIZRA GENESIS NODE - SERVICE LEVEL OBJECTIVES (SLO) CONTRACT            ║
# ║  Version: 2.0.0 - Elite Full-Stack Blueprint                             ║
# ║  Last Updated: November 26, 2025                                          ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# This SLO contract defines the performance and reliability targets for
# BIZRA Genesis Node. All targets are enforced by CI/CD quality gates.
#
# USAGE:
# - CI/CD pipelines validate against these targets
# - Load tests (k6) check compliance before deployment
# - Prometheus alerts are configured from these values
# - SLO violations block production deployments

version: "2.0.0"
service: bizra-genesis-node

# ═══════════════════════════════════════════════════════════════════════════
# PERFORMANCE SLOs
# ═══════════════════════════════════════════════════════════════════════════

performance:
  # API Response Time Targets
  latency:
    # P50 latency (median) - typical user experience
    p50_ms: 100
    # P95 latency - 95% of requests must be faster than this
    p95_ms: 500
    # P99 latency - tail latency for reliability
    p99_ms: 1000
    # Maximum acceptable latency for any request
    max_ms: 5000

  # Error Rate Targets
  error_rate:
    # Maximum 4xx error rate (client errors)
    client_error_rate: 0.05
    # Maximum 5xx error rate (server errors) - CRITICAL
    server_error_rate: 0.01
    # Combined error rate target
    total_error_rate: 0.02

  # Throughput Targets
  throughput:
    # Minimum requests per second capacity
    min_rps: 1000
    # Target sustained throughput
    target_rps: 5000
    # Peak capacity (burst handling)
    peak_rps: 10000

  # Startup Performance
  startup:
    # Cold start time for new containers
    cold_start_ms: 15000
    # Warm start (restart) time
    warm_start_ms: 5000
    # Autoscale reaction time
    autoscale_reaction_s: 30

# ═══════════════════════════════════════════════════════════════════════════
# RELIABILITY SLOs
# ═══════════════════════════════════════════════════════════════════════════

reliability:
  # Availability Target (as percentage)
  # 99.95% = ~4.4 hours downtime per year
  availability_slo: 99.95

  # Recovery Targets
  recovery:
    # Recovery Time Objective - max time to restore service
    rto_minutes: 30
    # Recovery Point Objective - max acceptable data loss
    rpo_minutes: 5
    # Mean Time To Recovery target
    mttr_minutes: 15

  # Incident Response
  incidents:
    # Time to acknowledge critical incidents
    ack_time_minutes: 5
    # Time to start mitigation
    mitigation_start_minutes: 15
    # Post-incident review deadline
    pir_deadline_hours: 72

# ═══════════════════════════════════════════════════════════════════════════
# AI PROVIDER SLOs (Circuit Breaker Targets)
# ═══════════════════════════════════════════════════════════════════════════

ai_providers:
  # Circuit Breaker Configuration
  circuit_breaker:
    # Failures before opening circuit
    failure_threshold: 5
    # Time circuit stays open before half-open
    open_duration_s: 60
    # Successes needed to close circuit
    success_threshold: 3
    # Failure rate threshold (0.0-1.0)
    failure_rate_threshold: 0.4

  # Provider-Specific Targets
  ollama:
    # Local model inference timeout
    timeout_ms: 30000
    # Maximum retry attempts
    max_retries: 3
    # Target success rate
    success_rate: 0.99

  openai:
    # API timeout (longer for GPT-4)
    timeout_ms: 120000
    max_retries: 3
    success_rate: 0.99
    # Rate limit handling
    rate_limit_retry_delay_ms: 1000

  anthropic:
    timeout_ms: 120000
    max_retries: 3
    success_rate: 0.99
    rate_limit_retry_delay_ms: 1000

# ═══════════════════════════════════════════════════════════════════════════
# DATABASE SLOs
# ═══════════════════════════════════════════════════════════════════════════

database:
  postgresql:
    # Query latency targets
    query_p95_ms: 50
    query_p99_ms: 100
    # Connection pool targets
    pool_utilization_max: 0.8
    # Connection timeout
    connect_timeout_ms: 5000
    # Idle connection timeout
    idle_timeout_s: 600

  redis:
    # Cache latency targets
    latency_p95_ms: 5
    latency_p99_ms: 10
    # Cache hit rate target
    hit_rate_min: 0.85
    # Connection timeout
    connect_timeout_ms: 1000

# ═══════════════════════════════════════════════════════════════════════════
# OBSERVABILITY SLOs
# ═══════════════════════════════════════════════════════════════════════════

observability:
  # Monitoring Coverage
  metrics:
    # Scrape interval for Prometheus
    scrape_interval_s: 15
    # Metric retention period
    retention_days: 30
    # Custom metric coverage (percentage of endpoints)
    coverage_percent: 100

  # Alerting Targets
  alerting:
    # Time from incident to alert
    alert_latency_minutes: 5
    # False positive rate target
    false_positive_rate: 0.1
    # Alert acknowledgment time
    ack_time_minutes: 5

  # Logging
  logging:
    # Log ingestion latency
    ingestion_latency_s: 30
    # Log retention period
    retention_days: 90
    # Structured logging coverage
    structured_coverage: 1.0

  # Tracing
  tracing:
    # Trace sampling rate (production)
    sample_rate: 0.1
    # Trace retention period
    retention_days: 14

# ═══════════════════════════════════════════════════════════════════════════
# SECURITY SLOs
# ═══════════════════════════════════════════════════════════════════════════

security:
  # Authentication
  auth:
    # JWT validation latency
    validation_latency_ms: 10
    # Token refresh success rate
    refresh_success_rate: 0.999
    # Rate limit for auth endpoints
    rate_limit_per_minute: 120

  # Security Scanning
  scanning:
    # Vulnerability scan frequency
    vuln_scan_frequency_hours: 24
    # Maximum critical vulnerabilities allowed
    max_critical_vulns: 0
    # Maximum high vulnerabilities allowed
    max_high_vulns: 5

  # Secrets Management
  secrets:
    # Secret rotation frequency
    rotation_days: 90
    # Secret access audit coverage
    audit_coverage: 1.0

# ═══════════════════════════════════════════════════════════════════════════
# QUALITY GATES (CI/CD Enforcement)
# ═══════════════════════════════════════════════════════════════════════════

quality_gates:
  # Pre-merge gates
  pre_merge:
    - name: unit_tests
      required: true
      threshold: 0.80  # 80% pass rate minimum
    - name: lint_check
      required: true
    - name: security_audit
      required: true
      max_critical: 0
    - name: coverage
      required: false
      threshold: 0.70  # 70% code coverage target

  # Pre-deploy gates
  pre_deploy:
    - name: integration_tests
      required: true
    - name: load_tests
      required: true
      slo_compliance: true
    - name: security_scan
      required: true
    - name: smoke_tests
      required: true

  # Post-deploy validation
  post_deploy:
    - name: health_check
      required: true
      timeout_s: 300
    - name: canary_analysis
      required: false
      duration_minutes: 30
    - name: slo_validation
      required: true
      observation_minutes: 60

# ═══════════════════════════════════════════════════════════════════════════
# ERROR BUDGET
# ═══════════════════════════════════════════════════════════════════════════

error_budget:
  # Monthly error budget based on 99.95% SLO
  # 100% - 99.95% = 0.05% = ~21.6 minutes per month
  monthly_budget_minutes: 21.6

  # Error budget burn rate alerts
  alerts:
    # Fast burn: 14.4x budget consumption rate (depletes in 2 days)
    fast_burn_rate: 14.4
    fast_burn_window_hours: 1
    # Slow burn: 6x budget consumption rate (depletes in 5 days)
    slow_burn_rate: 6.0
    slow_burn_window_hours: 6

  # Budget consumption thresholds for actions
  thresholds:
    # Freeze non-critical deploys
    deploy_freeze: 0.75
    # All-hands incident response
    incident_response: 0.90
    # Service degradation allowed
    degradation_allowed: 0.50
