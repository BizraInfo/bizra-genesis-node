global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 5s

rule_files:
  # - "alert_rules.yml"
  # - "recording_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"
    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "bizra-genesis-node"
    scrape_interval: 5s
    scrape_timeout: 3s
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "app:3000"
        labels:
          environment: "observability-testing"
          service: "genesis-node"

  - job_name: "pushgateway"
    scrape_interval: 30s
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

# Alertmanager configuration (optional)
