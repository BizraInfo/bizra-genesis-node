# BIZRA Node0 - Trivy Secret Scanning Configuration
# Document ID: BIZRA-NODE0-v1.0.0-GENESIS

rules:
  - id: aws-access-key-id
    description: AWS Access Key ID
    regex: '(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'
    keywords:
      - aws
      - access
      - key
    severity: CRITICAL
    allow-rules:
      - description: Allow test keys
        regex: 'AKIAIOSFODNN7EXAMPLE'

  - id: aws-secret-access-key
    description: AWS Secret Access Key
    regex: '(?i)aws(.{0,20})?(?-i)[''"][0-9a-zA-Z\/+]{40}[''"]'
    severity: CRITICAL

  - id: github-token
    description: GitHub Personal Access Token
    regex: 'ghp_[a-zA-Z0-9]{36}'
    severity: CRITICAL

  - id: github-oauth
    description: GitHub OAuth Access Token
    regex: 'gho_[a-zA-Z0-9]{36}'
    severity: CRITICAL

  - id: github-app-token
    description: GitHub App Token
    regex: '(?:ghu|ghs)_[a-zA-Z0-9]{36}'
    severity: HIGH

  - id: private-key
    description: Private Key
    regex: '-----BEGIN (?:RSA|DSA|EC|OPENSSH) PRIVATE KEY-----'
    severity: CRITICAL

  - id: jwt-token
    description: JWT Token
    regex: 'eyJ[A-Za-z0-9-_=]+\.eyJ[A-Za-z0-9-_=]+\.[A-Za-z0-9-_.+/=]*'
    severity: HIGH

  - id: postgres-connection
    description: PostgreSQL Connection String
    regex: 'postgres(?:ql)?:\/\/[^:]+:[^@]+@[^\/]+'
    severity: HIGH

  - id: redis-url
    description: Redis Connection URL
    regex: 'redis:\/\/[^:]*:[^@]+@[^\/]+'
    severity: HIGH

  - id: slack-webhook
    description: Slack Webhook URL
    regex: 'https://hooks\.slack\.com/services/[A-Z0-9]+/[A-Z0-9]+/[a-zA-Z0-9]+'
    severity: MEDIUM

  - id: openai-api-key
    description: OpenAI API Key
    regex: 'sk-[a-zA-Z0-9]{48}'
    severity: HIGH

  - id: anthropic-api-key
    description: Anthropic API Key
    regex: 'sk-ant-[a-zA-Z0-9-_]{32,}'
    severity: HIGH

  - id: bizra-internal-key
    description: BIZRA Internal Key
    regex: 'bizra_[a-zA-Z0-9]{32,}'
    severity: MEDIUM

allow-rules:
  - id: allow-examples
    description: Allow example/test secrets
    regex: '(?i)(example|test|fake|dummy|placeholder)'
  
  - id: allow-env-files
    description: Allow .env.example files
    paths:
      - '**/.env.example'
      - '**/.env.sample'
      - '**/.env.template'

  - id: allow-docs
    description: Allow documentation
    paths:
      - '**/README.md'
      - '**/docs/**'
      - '**/*.md'

disable-rules:
  - generic-api-key  # Too many false positives
