# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  BIZRA GENESIS NODE - CANARY DEPLOYMENT CONFIGURATION                     ║
# ║  Progressive rollout with automatic SLO-based promotion/rollback          ║
# ║  Version: 2.0.0 - Elite Full-Stack Blueprint                              ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# DEPLOYMENT STRATEGY:
# 1. Deploy canary with 10% traffic
# 2. Monitor SLO metrics for 5 minutes
# 3. If SLOs pass, promote to 50%, then 100%
# 4. If SLOs fail, automatic rollback
#
# PREREQUISITES:
# - Kubernetes 1.21+
# - Prometheus + Prometheus Adapter (for HPA metrics)
# - Istio or similar service mesh (for traffic splitting)
#
# USAGE:
# kubectl apply -f k8s/canary-deployment.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: bizra-genesis
  labels:
    app.kubernetes.io/name: bizra-genesis-node
    app.kubernetes.io/part-of: bizra-platform
    istio-injection: enabled

---
# ═══════════════════════════════════════════════════════════════════════════
# CONFIGMAP - Application Configuration
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: bizra-genesis-config
  namespace: bizra-genesis
  labels:
    app: bizra-genesis-node
data:
  # SLO Targets (from ops/slo.yaml)
  SLO_LATENCY_P50_MS: "100"
  SLO_LATENCY_P95_MS: "500"
  SLO_LATENCY_P99_MS: "1000"
  SLO_ERROR_RATE: "0.02"
  SLO_AVAILABILITY: "99.95"

  # Application settings
  RUST_LOG: "info,bizra_genesis_node=debug"
  PORT: "3000"

  # Feature flags
  CANARY_ENABLED: "true"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"

---
# ═══════════════════════════════════════════════════════════════════════════
# STABLE DEPLOYMENT - Production baseline
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizra-genesis-stable
  namespace: bizra-genesis
  labels:
    app: bizra-genesis-node
    version: stable
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bizra-genesis-node
      version: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bizra-genesis-node
        version: stable
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: bizra-genesis-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: bizra-genesis-node
        image: bizra/genesis-node:stable
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        envFrom:
        - configMapRef:
            name: bizra-genesis-config
        - secretRef:
            name: bizra-genesis-secrets

        env:
        - name: DEPLOYMENT_TRACK
          value: "stable"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        # Kubernetes probes (aligned with health check aggregator)
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - bizra-genesis-node
              topologyKey: kubernetes.io/hostname

---
# ═══════════════════════════════════════════════════════════════════════════
# CANARY DEPLOYMENT - New version for validation
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizra-genesis-canary
  namespace: bizra-genesis
  labels:
    app: bizra-genesis-node
    version: canary
    track: canary
spec:
  replicas: 1  # Start with single canary pod
  selector:
    matchLabels:
      app: bizra-genesis-node
      version: canary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bizra-genesis-node
        version: canary
        track: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
        # Canary-specific annotations
        canary.bizra.io/enabled: "true"
        canary.bizra.io/weight: "10"
    spec:
      serviceAccountName: bizra-genesis-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: bizra-genesis-node
        image: bizra/genesis-node:canary  # Canary version
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        envFrom:
        - configMapRef:
            name: bizra-genesis-config
        - secretRef:
            name: bizra-genesis-secrets

        env:
        - name: DEPLOYMENT_TRACK
          value: "canary"
        - name: CANARY_WEIGHT
          value: "10"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}

---
# ═══════════════════════════════════════════════════════════════════════════
# SERVICE - Load balancer for both stable and canary
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: bizra-genesis-node
  namespace: bizra-genesis
  labels:
    app: bizra-genesis-node
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: bizra-genesis-node
    # Note: Selector matches both stable and canary pods
    # Traffic splitting is handled by Istio VirtualService

---
# ═══════════════════════════════════════════════════════════════════════════
# ISTIO VIRTUALSERVICE - Traffic splitting for canary
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: bizra-genesis-canary-vs
  namespace: bizra-genesis
spec:
  hosts:
  - bizra-genesis-node
  - bizra-genesis.local
  http:
  - match:
    - headers:
        x-canary:
          exact: "true"
    route:
    - destination:
        host: bizra-genesis-node
        subset: canary
      weight: 100
  - route:
    # 90% to stable, 10% to canary (initial rollout)
    - destination:
        host: bizra-genesis-node
        subset: stable
      weight: 90
    - destination:
        host: bizra-genesis-node
        subset: canary
      weight: 10

---
# ═══════════════════════════════════════════════════════════════════════════
# ISTIO DESTINATIONRULE - Define stable and canary subsets
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: bizra-genesis-dr
  namespace: bizra-genesis
spec:
  host: bizra-genesis-node
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy: UPGRADE
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
  subsets:
  - name: stable
    labels:
      version: stable
  - name: canary
    labels:
      version: canary

---
# ═══════════════════════════════════════════════════════════════════════════
# HORIZONTAL POD AUTOSCALER - Scale based on SLO metrics
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bizra-genesis-hpa
  namespace: bizra-genesis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bizra-genesis-stable
  minReplicas: 3
  maxReplicas: 20
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metrics (requires Prometheus Adapter)
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: 1000  # Scale at 1000 RPS per pod
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max

---
# ═══════════════════════════════════════════════════════════════════════════
# POD DISRUPTION BUDGET - Ensure availability during updates
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bizra-genesis-pdb
  namespace: bizra-genesis
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: bizra-genesis-node
      track: stable

---
# ═══════════════════════════════════════════════════════════════════════════
# SERVICE ACCOUNT
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bizra-genesis-sa
  namespace: bizra-genesis
  labels:
    app: bizra-genesis-node

---
# ═══════════════════════════════════════════════════════════════════════════
# PROMETHEUS SERVICEMONITOR - SLO metric collection
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bizra-genesis-monitor
  namespace: bizra-genesis
  labels:
    app: bizra-genesis-node
    release: prometheus
spec:
  selector:
    matchLabels:
      app: bizra-genesis-node
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
    scheme: http
  namespaceSelector:
    matchNames:
    - bizra-genesis

---
# ═══════════════════════════════════════════════════════════════════════════
# PROMETHEUS ALERTING RULES - SLO violation alerts
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bizra-genesis-slo-alerts
  namespace: bizra-genesis
  labels:
    app: bizra-genesis-node
    release: prometheus
spec:
  groups:
  - name: bizra-genesis-slo
    interval: 30s
    rules:
    # Latency SLO violation
    - alert: BizraGenesisLatencySLOViolation
      expr: |
        histogram_quantile(0.95,
          sum(rate(http_request_duration_seconds_bucket{job="bizra-genesis-node"}[5m])) by (le)
        ) > 0.5
      for: 5m
      labels:
        severity: warning
        service: bizra-genesis-node
      annotations:
        summary: "BIZRA Genesis Node P95 latency exceeds 500ms SLO"
        description: "P95 latency is {{ $value }}s, which exceeds the 500ms SLO target"

    # Error rate SLO violation
    - alert: BizraGenesisErrorRateSLOViolation
      expr: |
        sum(rate(http_requests_total{job="bizra-genesis-node",status=~"5.."}[5m])) /
        sum(rate(http_requests_total{job="bizra-genesis-node"}[5m])) > 0.01
      for: 5m
      labels:
        severity: critical
        service: bizra-genesis-node
      annotations:
        summary: "BIZRA Genesis Node error rate exceeds 1% SLO"
        description: "Server error rate is {{ $value | humanizePercentage }}"

    # Canary failure detection
    - alert: BizraGenesisCanaryFailure
      expr: |
        sum(rate(http_requests_total{job="bizra-genesis-node",version="canary",status=~"5.."}[5m])) /
        sum(rate(http_requests_total{job="bizra-genesis-node",version="canary"}[5m])) > 0.05
      for: 2m
      labels:
        severity: critical
        service: bizra-genesis-node
        track: canary
      annotations:
        summary: "BIZRA Genesis canary deployment showing elevated errors"
        description: "Canary error rate {{ $value | humanizePercentage }} - consider rollback"

    # Error budget consumption
    - alert: BizraGenesisErrorBudgetBurning
      expr: |
        (
          1 - (
            sum(rate(http_requests_total{job="bizra-genesis-node",status!~"5.."}[1h])) /
            sum(rate(http_requests_total{job="bizra-genesis-node"}[1h]))
          )
        ) / (1 - 0.9995) > 6
      for: 1h
      labels:
        severity: warning
        service: bizra-genesis-node
      annotations:
        summary: "BIZRA Genesis error budget burning too fast"
        description: "Error budget consumption rate is 6x normal - will deplete in 5 days at this rate"
