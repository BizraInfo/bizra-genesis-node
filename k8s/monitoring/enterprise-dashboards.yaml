---
# Enterprise Executive Command Center Dashboard - Phase THREE Advanced Monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-executive-command-center
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    dashboard: executive-command-center
    managed-by: elite-practitioner
data:
  executive-command-center.json: |
    {
      "dashboard": {
        "title": "BIZRA Genesis Node - Executive Command Center",
        "tags": ["enterprise", "executive", "command-center"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Global System Health",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=~\"bizra-api|bizra-db|bizra-cache\"}",
                "legendFormat": "{{ service }} health"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": [
                  {
                    "options": {
                      "0": {
                        "text": "DOWN",
                        "color": "red"
                      },
                      "1": {
                        "text": "UP",
                        "color": "green"
                      }
                    },
                    "type": "value"
                  }
                ]
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 0
            }
          },
          {
            "id": 2,
            "title": "Processing Latency P95",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "P95 Latency"
              }
            ],
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 0
            }
          },
          {
            "id": 3,
            "title": "Request Throughput by Region",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])",
                "legendFormat": "RPS {{ region }}"
              }
            ],
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 8
            }
          },
          {
            "id": 4,
            "title": "AI Consensus Accuracy",
            "type": "gauge",
            "targets": [
              {
                "expr": "bizra_consensus_accuracy_ratio * 100",
                "legendFormat": "Accuracy %"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0,
                "max": 100,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 85
                    },
                    {
                      "color": "green",
                      "value": 95
                    }
                  ]
                }
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 8
            }
          },
          {
            "id": 5,
            "title": "Security Compliance Status",
            "type": "stat",
            "targets": [
              {
                "expr": "bizra_compliance_status{regulation=~\"SOC2|GDPR|HIPAA\"}",
                "legendFormat": "{{ regulation }}: {{ status }}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": [
                  {
                    "options": {
                      "0": {
                        "text": "NON-COMPLIANT",
                        "color": "red"
                      },
                      "1": {
                        "text": "COMPLIANT",
                        "color": "green"
                      }
                    },
                    "type": "value"
                  }
                ]
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 16
            }
          },
          {
            "id": 6,
            "title": "Global Traffic Distribution",
            "type": "worldmap",
            "targets": [
              {
                "expr": "rate(http_requests_total[10m])",
                "legendFormat": "{{ region }} traffic"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": []
              }
            },
            "gridPos": {
              "h": 12,
              "w": 12,
              "x": 12,
              "y": 16
            }
          },
          {
            "id": 7,
            "title": "Cost Optimization Metrics",
            "type": "table",
            "targets": [
              {
                "expr": "bizra_cost_per_request",
                "legendFormat": "Cost per request"
              },
              {
                "expr": "bizra_instance_utilization",
                "legendFormat": "{{ instance }} utilization"
              }
            ],
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 24
            }
          }
        ],
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "timepicker": {},
        "templating": {
          "list": [
            {
              "name": "region",
              "query": "label_values(region)",
              "type": "query"
            }
          ]
        },
        "annotations": {
          "list": [
            {
              "builtIn": 1,
              "datasource": "-- Grafana --",
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "type": "dashboard"
            }
          ]
        },
        "refresh": "30s",
        "schemaVersion": 27,
        "version": 0,
        "links": []
      }
    }

---
# Operational Excellence Dashboard - Phase THREE Enterprise Monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-operational-excellence
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    dashboard: operational-excellence
    managed-by: elite-practitioner
data:
  operational-excellence.json: |
    {
      "dashboard": {
        "title": "Operational Excellence Monitoring",
        "tags": ["operations", "excellence", "slo"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Error Rate by Service",
            "type": "table",
            "targets": [
              {
                "expr": "rate(http_requests_total{status=~\"5..\"}[5m]) / rate(http_requests_total[5m]) * 100",
                "legendFormat": "{{ service }} error rate %"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "yellow",
                      "value": 5
                    },
                    {
                      "color": "red",
                      "value": 10
                    }
                  ]
                }
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 0
            }
          },
          {
            "id": 2,
            "title": "SLO Achievement",
            "type": "gauge",
            "targets": [
              {
                "expr": "(1 - (rate(http_requests_total{status=~\"5..\"}[5m]) / rate(http_requests_total[5m]))) * 100",
                "legendFormat": "SLO Achievement %"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 90,
                "max": 100,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": 90
                    },
                    {
                      "color": "yellow",
                      "value": 95
                    },
                    {
                      "color": "green",
                      "value": 99.5
                    }
                  ]
                }
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 0
            }
          },
          {
            "id": 3,
            "title": "Resource Efficiency Heatmap",
            "type": "heatmap",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total[5m]) / rate(container_spec_cpu_quota[5m])",
                "legendFormat": "CPU utilization"
              }
            ],
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 8
            }
          },
          {
            "id": 4,
            "title": "Deployment History & Changes",
            "type": "logs",
            "targets": [
              {
                "expr": "{job=\"bizra-deployment-tracker\"}",
                "legendFormat": "Deployment: {{ deployment_id }}"
              }
            ],
            "options": {
              "showTime": true,
              "showLabels": true,
              "maxItems": 50
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 8
            }
          },
          {
            "id": 5,
            "title": "Incident Response Timeline",
            "type": "timeline",
            "targets": [
              {
                "expr": "bizra_incident_start_time",
                "legendFormat": "Incident Start"
              },
              {
                "expr": "bizra_incident_resolution_time",
                "legendFormat": "Resolution Time"
              }
            ],
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 16
            }
          },
          {
            "id": 6,
            "title": "Performance Baseline vs Current",
            "type": "bargauge",
            "targets": [
              {
                "expr": "http_request_duration_seconds{quantile=\"0.95\"} / bizra_performance_baseline",
                "legendFormat": "Performance vs Baseline"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0.5,
                "max": 1.5,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "red",
                      "value": 1.2
                    },
                    {
                      "color": "yellow",
                      "value": 1.1
                    },
                    {
                      "color": "green",
                      "value": 1.0
                    }
                  ]
                }
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 16
            }
          },
          {
            "id": 7,
            "title": "Auto-scaling Events",
            "type": "logs",
            "targets": [
              {
                "expr": "{job=\"keda\"}",
                "legendFormat": "KEDA Scaling: {{ scaledobject }}"
              }
            ],
            "gridPos": {
              "h": 8,
              "w": 24,
              "x": 0,
              "y": 24
            }
          }
        ],
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "timepicker": {},
        "templating": {
          "list": [
            {
              "name": "service",
              "query": "label_values(service)",
              "type": "query"
            },
            {
              "name": "region",
              "query": "label_values(region)",
              "type": "query"
            }
          ]
        },
        "annotations": {
          "list": [
            {
              "builtin": 1,
              "datasource": "-- Grafana --",
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "target": {
                "limit": 100,
                "matchAny": false,
                "tags": [],
                "type": "dashboard"
              },
              "type": "dashboard"
            }
          ]
        },
        "refresh": "1m",
        "schemaVersion": 27,
        "version": 0,
        "links": []
      }
    }
