# BIZRA Node0 - Kustomization
# Document ID: BIZRA-NODE0-v1.0.0-GENESIS

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: bizra-node0

namespace: bizra-node0

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/version: "1.0.0"
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: bizra

resources:
  - namespace.yaml
  - secrets.yaml
  - api-deployment.yaml
  - dashboard-deployment.yaml
  - postgres-statefulset.yaml
  - ingress.yaml

configMapGenerator:
  - name: bizra-config
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - API_PORT=8080
      - DASHBOARD_PORT=3000

images:
  - name: bizra/node0-api
    newTag: "1.0.0"
  - name: bizra/node0-dashboard
    newTag: "1.0.0"
  - name: postgres
    newName: postgres
    newTag: "16-alpine"

replicas:
  - name: bizra-api
    count: 2
  - name: bizra-dashboard
    count: 2

commonAnnotations:
  bizra.network/environment: production
  bizra.network/team: platform
