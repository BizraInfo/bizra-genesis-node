# BIZRA Node0 - Secrets (Template)
# Document ID: BIZRA-NODE0-v1.0.0-GENESIS
#
# NOTE: This is a template. In production, use:
# - External Secrets Operator
# - Sealed Secrets
# - HashiCorp Vault
# - AWS Secrets Manager / Azure Key Vault

apiVersion: v1
kind: Secret
metadata:
  name: bizra-secrets
  namespace: bizra-node0
  labels:
    app: bizra-node0
type: Opaque
stringData:
  # Database credentials
  db-user: "bizra_node0"
  db-password: "${DB_PASSWORD}"  # Replace with actual password
  database-url: "postgres://bizra_node0:${DB_PASSWORD}@postgres:5432/bizra_genesis"
  
  # Redis
  redis-url: "redis://redis:6379"
  
  # JWT Secret
  jwt-secret: "${JWT_SECRET}"  # Generate with: openssl rand -base64 32
  
  # Encryption keys
  encryption-key: "${ENCRYPTION_KEY}"  # Generate with: openssl rand -hex 32
---
