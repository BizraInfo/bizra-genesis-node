# BIZRA Node0 - Ingress Configuration
# Document ID: BIZRA-NODE0-v1.0.0-GENESIS

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bizra-ingress
  namespace: bizra-node0
  labels:
    app: bizra-ingress
    app.kubernetes.io/name: bizra-ingress
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: bizra-node0
  annotations:
    # Nginx Ingress Controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    
    # SSL/TLS
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization"
spec:
  tls:
    - hosts:
        - node0.bizra.network
        - api.node0.bizra.network
      secretName: bizra-tls-secret
  rules:
    # Dashboard
    - host: node0.bizra.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bizra-dashboard
                port:
                  number: 3000
    
    # API
    - host: api.node0.bizra.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bizra-api
                port:
                  number: 8080
---
# ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@bizra.foundation
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
