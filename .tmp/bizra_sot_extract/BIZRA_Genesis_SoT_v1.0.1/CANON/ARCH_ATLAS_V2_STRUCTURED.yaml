- id: D5
  title: Governance & Crown Pipeline
  truth: DERIVED
  tag: PIPELINE
  layers:
  - Gov
  - Crown
  snr: 0.86
  pipeline:
  - 'Change origin: idea/proposal from SAT department → Department CEO review/approve
    → create change package (spec+rationale+tests)'
  - 'Governance voting: on-chain publication → community debate (7 days) → token-holder
    vote (BLOOM-weighted) → quorum/majority check'
  - 'SAT-CEO review: evaluates impact+alignment+risk → signs approval (cryptographic)'
  - 'Progressive rollout gates: Gate 3 Full Rollout (100%) monitor 7 days; Canary/Shadow
    implied; monitor 72h stage present'
  - 'Crown proof chain verification: Accept / Reject / Revise outcomes; resubmit on
    revise'
