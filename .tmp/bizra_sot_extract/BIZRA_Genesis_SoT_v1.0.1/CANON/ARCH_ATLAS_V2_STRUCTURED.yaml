- id: D2
  title: Node Identity & Lifecycle
  truth: DERIVED
  tag: POI_VALIDATED
  layers:
  - L1
  - L2
  snr: 0.8
  flow:
  - Human candidate → pledge + accept constitution → privacy-preserving identity verification
    → generate Ed25519 keypair → assign NodeID
  - Install client (desktop/mobile) → register resource availability to pool → attach
    PAT-N team (4 personal agents)
  - Active node contributes resources (compute/storage/knowledge) → generates cryptographic
    attestations
  - Aggregate PoI bundle → record to BlockGraph → calculate rewards (SEED + BLOOM)
    → distribute to node wallet → update reputation/impact score (loop)
