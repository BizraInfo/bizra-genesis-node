# BIZRA Node0 - Prometheus Configuration
# Document ID: BIZRA-NODE0-v1.0.0-GENESIS
#
# Elite Observability Standards:
# - Multi-target scraping
# - Service discovery
# - Alert rules integration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'bizra-node0'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/alerts/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scheme: http

  # BIZRA API Server
  - job_name: 'bizra-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s
    scrape_timeout: 5s

  # Node Exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: /metrics

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: /metrics

  # Cadvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics
    scheme: http

  # Ollama
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s

  # Dashboard (Next.js)
  - job_name: 'dashboard'
    static_configs:
      - targets: ['dashboard:3000']
    metrics_path: /api/metrics
    scheme: http

  # Telemetry Bridge
  - job_name: 'bridge'
    static_configs:
      - targets: ['bridge:3002']
    metrics_path: /metrics
    scheme: http

