# BIZRA Node0 - Alertmanager Configuration
# Document ID: BIZRA-NODE0-v1.0.1-GENESIS
# Elite Alert Routing and Notification Management

global:
  # Global SMTP settings
  smtp_smarthost: '${SMTP_HOST:-smtp.gmail.com}:${SMTP_PORT:-587}'
  smtp_from: 'alerts@bizra.foundation'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true
  
  # Global Slack settings
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  
  # Global settings
  resolve_timeout: 5m

# Templates for alert formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert routing
route:
  # Default receiver
  receiver: 'default-receiver'
  
  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'job']
  
  # Wait time before sending first notification
  group_wait: 30s
  
  # Wait time before sending updates
  group_interval: 5m
  
  # Wait time before resending
  repeat_interval: 4h
  
  # Child routes for specific handling
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
      continue: true
    
    # High severity alerts
    - match:
        severity: high
      receiver: 'high-receiver'
      group_wait: 1m
      repeat_interval: 2h
    
    # Database alerts
    - match:
        job: postgres
      receiver: 'database-receiver'
      group_by: ['alertname', 'instance']
    
    # Redis alerts
    - match:
        job: redis
      receiver: 'database-receiver'
    
    # LLM/Ollama alerts
    - match:
        job: ollama
      receiver: 'ai-receiver'
      group_wait: 1m
    
    # BIZRA-specific alerts (PoI, PAT, Ihsan)
    - match_re:
        alertname: '^(LowIhsanScore|PoI|PAT).*'
      receiver: 'bizra-receiver'
      group_by: ['alertname']
    
    # Low severity / info alerts
    - match:
        severity: info
      receiver: 'default-receiver'
      repeat_interval: 12h

# Receivers define notification destinations
receivers:
  # Default receiver - email
  - name: 'default-receiver'
    email_configs:
      - to: 'ops@bizra.foundation'
        send_resolved: true
        headers:
          Subject: '[BIZRA Alert] {{ .GroupLabels.alertname }}'
        html: |
          <h2>BIZRA Node0 Alert</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
          <p><strong>Summary:</strong> {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}</p>
          <p><strong>Time:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>

  # Critical receiver - Slack + PagerDuty + Email
  - name: 'critical-receiver'
    slack_configs:
      - channel: '#bizra-alerts-critical'
        username: 'BIZRA Alert Bot'
        icon_emoji: ':rotating_light:'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          *Severity:* {{ .GroupLabels.severity }}
          *Job:* {{ .GroupLabels.job }}
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        actions:
          - type: button
            text: 'View in Grafana'
            url: 'http://grafana:3000/d/bizra-overview'
    
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: critical
        description: '{{ .GroupLabels.alertname }}'
        details:
          summary: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    
    email_configs:
      - to: 'critical@bizra.foundation,cto@bizra.foundation'
        send_resolved: true

  # High severity receiver
  - name: 'high-receiver'
    slack_configs:
      - channel: '#bizra-alerts'
        username: 'BIZRA Alert Bot'
        icon_emoji: ':warning:'
        send_resolved: true
        title: '⚠️ HIGH: {{ .GroupLabels.alertname }}'
        text: |
          *Severity:* {{ .GroupLabels.severity }}
          *Job:* {{ .GroupLabels.job }}
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          {{ end }}
    
    email_configs:
      - to: 'ops@bizra.foundation'
        send_resolved: true

  # Database alerts receiver
  - name: 'database-receiver'
    slack_configs:
      - channel: '#bizra-database'
        username: 'BIZRA DB Monitor'
        icon_emoji: ':floppy_disk:'
        send_resolved: true
        title: '💾 Database Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Instance:* {{ .GroupLabels.instance }}
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          {{ end }}
    
    email_configs:
      - to: 'dba@bizra.foundation'
        send_resolved: true

  # AI/LLM alerts receiver
  - name: 'ai-receiver'
    slack_configs:
      - channel: '#bizra-ai-ops'
        username: 'BIZRA AI Monitor'
        icon_emoji: ':robot_face:'
        send_resolved: true
        title: '🤖 AI Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Model/Service:* {{ .GroupLabels.job }}
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  # BIZRA-specific alerts (Sovereignty, PoI, Ihsan)
  - name: 'bizra-receiver'
    slack_configs:
      - channel: '#bizra-sovereignty'
        username: 'BIZRA Sovereignty Monitor'
        icon_emoji: ':shield:'
        send_resolved: true
        title: '🛡️ Sovereignty Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

# Inhibition rules to prevent alert flooding
inhibit_rules:
  # If critical is firing, suppress high
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'high'
    equal: ['alertname', 'job', 'instance']
  
  # If service is down, suppress other alerts for that service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['job', 'instance']
  
  # If PostgreSQL is down, suppress all database alerts
  - source_match:
      alertname: 'PostgresDown'
    target_match_re:
      alertname: 'Postgres.*'
    equal: ['instance']
  
  # If Ollama is down, suppress AI-related alerts
  - source_match:
      alertname: 'OllamaDown'
    target_match_re:
      alertname: '(PATAgentError|OllamaHighLatency|OllamaHighGPUMemory)'
