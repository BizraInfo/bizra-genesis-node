# BIZRA Node0 - Grafana Dashboard Provisioning
# Document ID: BIZRA-NODE0-v1.0.0-GENESIS

apiVersion: 1

providers:
  - name: 'BIZRA Dashboards'
    orgId: 1
    folder: 'BIZRA Node0'
    folderUid: 'bizra-node0'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
