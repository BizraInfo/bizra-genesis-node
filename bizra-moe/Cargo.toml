[package]
name = "bizra-moe"
version = "0.1.0"
edition = "2021"
authors = ["BIZRA Core Team"]
description = "Multi-Model Ensemble with Ollama integration and harmonic synthesis"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }

# HTTP client for Ollama API
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Statistics (for confidence scoring)
statrs = "0.18"

# Utilities
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Connection pooling
deadpool = "0.12"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.6"
proptest = "1.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
default = []
test-utils = []

[[bench]]
name = "moe_benchmarks"
harness = false
