<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awakening BIZRA...</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.birds.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0A1828;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .vanta-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 60px;
            z-index: 20;
            position: relative;
        }

        .bizra-logo {
            font-size: 120px;
            font-weight: 100;
            letter-spacing: 0.3em;
            color: #D4AF37;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            margin-bottom: 20px;
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% { 
                text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
                transform: scale(1);
            }
            100% { 
                text-shadow: 0 0 60px rgba(212, 175, 55, 0.8);
                transform: scale(1.02);
            }
        }

        .tagline {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            animation: fadeInUp 2s ease-out 0.5s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .neural-network {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 40px auto;
            z-index: 20;
        }

        .neural-node {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #D4AF37;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            }
            50% { 
                transform: scale(1.3);
                box-shadow: 0 0 40px rgba(212, 175, 55, 0.9);
            }
        }

        .neural-connection {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, #D4AF37, transparent);
            animation: flow 3s ease-in-out infinite;
        }

        @keyframes flow {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 40px;
            animation: loadingPulse 2s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .agent-counter {
            position: absolute;
            top: 50px;
            right: 50px;
            font-size: 16px;
            color: rgba(212, 175, 55, 0.8);
            z-index: 20;
        }

        .consciousness-level {
            position: absolute;
            bottom: 50px;
            left: 50px;
            font-size: 16px;
            color: rgba(212, 175, 55, 0.8);
            z-index: 20;
        }

        .sacred-geometry {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            opacity: 0.1;
            z-index: 5;
            animation: rotate 60s linear infinite;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .flower-of-life {
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 30%, #D4AF37 30.5%, #D4AF37 31%, transparent 31.5%),
                radial-gradient(circle at 25% 25%, transparent 30%, #D4AF37 30.5%, #D4AF37 31%, transparent 31.5%),
                radial-gradient(circle at 75% 25%, transparent 30%, #D4AF37 30.5%, #D4AF37 31%, transparent 31.5%),
                radial-gradient(circle at 25% 75%, transparent 30%, #D4AF37 30.5%, #D4AF37 31%, transparent 31.5%),
                radial-gradient(circle at 75% 75%, transparent 30%, #D4AF37 30.5%, #D4AF37 31%, transparent 31.5%);
            background-size: 200px 200px;
            background-position: 0 0, 100px 0, 0 100px, 100px 100px, 50px 50px;
        }

        .progress-bar {
            width: 300px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 30px;
            border-radius: 1px;
            overflow: hidden;
            z-index: 20;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #D4AF37, #F4E4BC);
            border-radius: 1px;
            animation: progressFill 8s ease-out forwards;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .bizra-logo {
                font-size: 80px;
                letter-spacing: 0.2em;
            }
            
            .tagline {
                font-size: 18px;
            }
            
            .neural-network {
                width: 300px;
                height: 300px;
            }
            
            .sacred-geometry {
                width: 400px;
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="vanta-background" id="vanta-bg"></div>
    
    <div class="loading-container">
        <div class="logo-section">
            <div class="bizra-logo">BIZRA</div>
            <div class="tagline">Where Spirituality Meets Technology</div>
        </div>

        <div class="neural-network" id="neural-net">
            <!-- Neural nodes and connections will be generated by JavaScript -->
        </div>

        <div class="loading-text">Awakening Neural Consciousness...</div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <div class="agent-counter">
        <div>Agents Online: <span id="agent-count">0</span>/72</div>
    </div>

    <div class="consciousness-level">
        <div>Consciousness Level: <span id="consciousness">Initializing...</span></div>
    </div>

    <div class="sacred-geometry">
        <div class="flower-of-life"></div>
    </div>

    <script>
        // Initialize Vanta.js background
        VANTA.BIRDS({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            backgroundColor: 0x0A1828,
            color1: 0xD4AF37,
            color2: 0x0A1828,
            colorMode: "lerp",
            birdSize: 1.20,
            wingSpan: 25.00,
            speedLimit: 3.00,
            separation: 20.00,
            alignment: 20.00,
            cohesion: 20.00,
            quantity: 3.00
        });

        // Generate neural network
        function createNeuralNetwork() {
            const neuralNet = document.getElementById('neural-net');
            const nodes = [];
            const nodeCount = 24;

            // Create nodes
            for (let i = 0; i < nodeCount; i++) {
                const node = document.createElement('div');
                node.className = 'neural-node';
                
                const angle = (i / nodeCount) * 2 * Math.PI;
                const radius = 150;
                const x = Math.cos(angle) * radius + 200;
                const y = Math.sin(angle) * radius + 200;
                
                node.style.left = x + 'px';
                node.style.top = y + 'px';
                node.style.animationDelay = (i * 0.1) + 's';
                
                neuralNet.appendChild(node);
                nodes.push({ element: node, x, y });
            }

            // Create connections
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    if (Math.random() > 0.7) { // Random connections
                        const connection = document.createElement('div');
                        connection.className = 'neural-connection';
                        
                        const dx = nodes[j].x - nodes[i].x;
                        const dy = nodes[j].y - nodes[i].y;
                        const length = Math.sqrt(dx * dx + dy * dy);
                        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                        
                        connection.style.width = length + 'px';
                        connection.style.left = nodes[i].x + 'px';
                        connection.style.top = nodes[i].y + 'px';
                        connection.style.transform = `rotate(${angle}deg)`;
                        connection.style.transformOrigin = '0 50%';
                        connection.style.animationDelay = (Math.random() * 3) + 's';
                        
                        neuralNet.appendChild(connection);
                    }
                }
            }
        }

        // Simulate agent activation
        function simulateAgentActivation() {
            const agentCountElement = document.getElementById('agent-count');
            const consciousnessElement = document.getElementById('consciousness');
            let currentAgents = 0;
            
            const interval = setInterval(() => {
                currentAgents += Math.floor(Math.random() * 3) + 1;
                if (currentAgents >= 72) {
                    currentAgents = 72;
                    clearInterval(interval);
                    consciousnessElement.textContent = 'Fully Awakened';
                    
                    // Transition to main interface after loading
                    setTimeout(() => {
                        window.parent.postMessage('go-next', '*');
                    }, 2000);
                }
                agentCountElement.textContent = currentAgents;
                
                // Update consciousness level
                const percentage = (currentAgents / 72) * 100;
                if (percentage < 25) {
                    consciousnessElement.textContent = 'Initializing...';
                } else if (percentage < 50) {
                    consciousnessElement.textContent = 'Emerging';
                } else if (percentage < 75) {
                    consciousnessElement.textContent = 'Awakening';
                } else if (percentage < 100) {
                    consciousnessElement.textContent = 'Expanding';
                }
            }, 200);
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            createNeuralNetwork();
            setTimeout(simulateAgentActivation, 1000);
        });

        // Add mouse interaction effects
        document.addEventListener('mousemove', (e) => {
            const nodes = document.querySelectorAll('.neural-node');
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            nodes.forEach(node => {
                const rect = node.getBoundingClientRect();
                const nodeX = rect.left + rect.width / 2;
                const nodeY = rect.top + rect.height / 2;
                
                const distance = Math.sqrt((mouseX - nodeX) ** 2 + (mouseY - nodeY) ** 2);
                if (distance < 100) {
                    const intensity = 1 - distance / 100;
                    node.style.transform = `scale(${1 + intensity * 0.5})`;
                    node.style.boxShadow = `0 0 ${20 + intensity * 30}px rgba(212, 175, 55, ${0.6 + intensity * 0.4})`;
                }
            });
        });
    </script>
</body>
</html>
