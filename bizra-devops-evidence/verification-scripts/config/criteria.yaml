# BIZRA DevOps Evidence Criteria Configuration
# Maps claims to required evidence artifacts for verification

version: "1.0.0"
last_updated: "2025-11-27"

# Minimum content requirements
defaults:
  min_content_bytes: 100
  severity: standard

claims:
  # ============================================================================
  # PIPELINE CLAIMS (PIPE-xxx)
  # ============================================================================

  PIPE-001:
    description: "9-stage multi-environment pipeline with quality gates"
    category: pipeline
    severity: critical
    paths:
      - "01-pipelines/workflows/elite-devops-pipeline.yml"
    validation:
      - type: file_contains
        pattern: "stages:"
      - type: file_contains
        pattern: "quality-gate"

  PIPE-002:
    description: "AI-powered risk assessment analyzing 100+ signals"
    category: pipeline
    severity: critical
    paths:
      - "05-ai-risk-engine/risk_engine.ts"
      - "05-ai-risk-engine/pipeline_integration.yaml"

  PIPE-003:
    description: "Automated rollback on SLO breach"
    category: pipeline
    severity: high
    paths:
      - "01-pipelines/docs/pipeline_maturity.md"
      - "02-sre-and-slos/error_budget_policy.md"

  PIPE-004:
    description: "Blue-green and canary deployment strategies"
    category: pipeline
    severity: standard
    paths:
      - "01-pipelines/docs/deployment_strategies.md"

  # ============================================================================
  # SECURITY & COMPLIANCE CLAIMS (SEC-xxx)
  # ============================================================================

  SEC-001:
    description: "SOX automated financial controls"
    category: security
    severity: critical
    paths:
      - "03-security-and-compliance/sox_controls_automation.md"

  SEC-002:
    description: "GDPR privacy-by-design implementation"
    category: security
    severity: critical
    paths:
      - "03-security-and-compliance/gdpr_privacy_by_design.md"

  SEC-003:
    description: "HIPAA security controls for PHI"
    category: security
    severity: high
    paths:
      - "03-security-and-compliance/hipaa_security_controls.md"

  SEC-004:
    description: "Controls matrix with 50+ automated checks"
    category: security
    severity: high
    paths:
      - "03-security-and-compliance/controls-matrix.csv"

  SEC-005:
    description: "Secret scanning with zero tolerance"
    category: security
    severity: critical
    paths:
      - "03-security-and-compliance/artifacts/audit_evidence/"

  # ============================================================================
  # RESILIENCE & CHAOS CLAIMS (RES-xxx)
  # ============================================================================

  RES-001:
    description: "Chaos testing framework with 7-layer failure simulation"
    category: resilience
    severity: critical
    paths:
      - "04-resilience-and-chaos/chaos_scenarios.yaml"

  RES-002:
    description: "Documented chaos runbook with blast radius controls"
    category: resilience
    severity: high
    paths:
      - "04-resilience-and-chaos/chaos_runbook.md"

  RES-003:
    description: "MTTR less than 5 minutes (measured)"
    category: resilience
    severity: high
    paths:
      - "04-resilience-and-chaos/artifacts/mttr_metrics.csv"

  RES-004:
    description: "Automated incident response playbooks"
    category: resilience
    severity: standard
    paths:
      - "04-resilience-and-chaos/incident_playbooks.md"

  # ============================================================================
  # SRE & SLO CLAIMS (SRE-xxx)
  # ============================================================================

  SRE-001:
    description: "99.95% availability SLO with error budgets"
    category: sre
    severity: critical
    paths:
      - "02-sre-and-slos/slos.yaml"

  SRE-002:
    description: "P95 latency under 500ms enforced in CI"
    category: sre
    severity: critical
    paths:
      - "02-sre-and-slos/slos.yaml"
      - "01-pipelines/workflows/elite-devops-pipeline.yml"

  SRE-003:
    description: "Error budget burn rate alerts (fast/slow)"
    category: sre
    severity: high
    paths:
      - "02-sre-and-slos/error_budget_policy.md"

  SRE-004:
    description: "Monthly SLO compliance reports"
    category: sre
    severity: standard
    paths:
      - "02-sre-and-slos/artifacts/slo_compliance_report_2025-11.md"

  # ============================================================================
  # AI RISK ENGINE CLAIMS (AI-xxx)
  # ============================================================================

  AI-001:
    description: "ML-powered deployment risk assessment"
    category: ai-risk
    severity: critical
    paths:
      - "05-ai-risk-engine/risk_engine_spec.md"

  AI-002:
    description: "100+ signal analysis (code, infra, time, team)"
    category: ai-risk
    severity: critical
    paths:
      - "05-ai-risk-engine/risk_engine.ts"

  AI-003:
    description: "Pipeline integration with automated gates"
    category: ai-risk
    severity: high
    paths:
      - "05-ai-risk-engine/pipeline_integration.yaml"

  AI-004:
    description: "Decision audit trail for all assessments"
    category: ai-risk
    severity: standard
    paths:
      - "05-ai-risk-engine/artifacts/decision_logs/"
    min_content_bytes: 0

  # ============================================================================
  # GOVERNANCE CLAIMS (GOV-xxx)
  # ============================================================================

  GOV-001:
    description: "Formal change management policy"
    category: governance
    severity: high
    paths:
      - "06-governance-and-process/change_management_policy.md"

  GOV-002:
    description: "RFC process for architectural decisions"
    category: governance
    severity: high
    paths:
      - "06-governance-and-process/rfc_process.md"

  GOV-003:
    description: "Sample RFCs demonstrating process"
    category: governance
    severity: standard
    paths:
      - "06-governance-and-process/artifacts/sample_rfcs/RFC-001-ai-risk-engine.md"
