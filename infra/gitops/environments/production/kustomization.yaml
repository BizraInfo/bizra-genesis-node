# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  BIZRA PRODUCTION ENVIRONMENT - ELITE GITOPS CONFIGURATION               ║
# ║  Professional Enterprise Standards Implementation                        ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: bizra-production
  annotations:
    config.kubernetes.io/local-config: "true"

# Base configurations (shared across environments)
bases:
  - ../../../base/

# Production-specific customizations
patchesStrategicMerge:
  - production-overlays.yaml

# Environment-specific configmaps
configMapGenerator:
  - name: bizra-production-config
    literals:
      - ENVIRONMENT=production
      - DORA_ELITE_DEPLOYMENT_FREQUENCY=7
      - SLO_AVAILABILITY=0.9999
      - SLO_LATENCY_P95=0.1
      - SLO_ERROR_RATE=0.005

# Production secrets (external management recommended)
# secrets:
#   - name: bizra-production-secrets
#     type: external
#     provider: vault
#     server: https://vault.bizra.net

# Resource constraints (production hardening)
patches:
  - target:
      kind: Deployment
      name: bizra-backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: bizra-backend
      spec:
        template:
          spec:
            containers:
            - name: bizra-backend
              resources:
                requests:
                  cpu: "2"
                  memory: "4Gi"
                limits:
                  cpu: "8"
                  memory: "16Gi"
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL

# Production namespace isolation
namespace: bizra-production
