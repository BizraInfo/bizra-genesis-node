apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: secure-baseline }
spec:
  validationFailureAction: enforce
  rules:
    - name: disallow-privileged
      match: { resources: { kinds: ["Pod"] } }
      validate:
        message: "Privileged containers are not allowed."
        pattern: { spec: { containers: [ { securityContext: { privileged: "false" } } ] } }

    - name: require-ro-fs-nonroot
      match: { resources: { kinds: ["Pod"] } }
      validate:
        message: "Containers must run as non-root with read-only FS."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true

    - name: forbid-latest-tag
      match: { resources: { kinds: ["Pod"] } }
      validate:
        message: "Use immutable tags or digests."
        pattern: { spec: { containers: [ { image: "!*:latest" } ] } }

    - name: require-limits-requests
      match: { resources: { kinds: ["Pod"] } }
      validate:
        message: "CPU/Memory limits & requests required."
        pattern:
          spec:
            containers:
              - resources:
                  limits: { cpu: "?*", memory: "?*" }
                  requests: { cpu: "?*", memory: "?*" }
