apiVersion: kyverno.io/v2
kind: ClusterPolicy
metadata: { name: verify-image-signatures }
spec:
  validationFailureAction: enforce
  rules:
    - name: verify-cosign
      match: { resources: { kinds: ["Pod"] } }
      verifyImages:
        - imageReferences: ["ghcr.io/bizra/*"]
          attestors:
            - entries:
                - keys:
                    kms: "https://cas.sigstore.dev"
