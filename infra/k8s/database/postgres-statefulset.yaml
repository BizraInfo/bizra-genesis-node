# infra/k8s/database/postgres-statefulset.yaml
# Production-grade PostgreSQL StatefulSet for BIZRA Genesis Node
#
# Features:
# - StatefulSet for stable network identity and persistent storage
# - Resource limits and requests for predictable performance
# - Liveness and readiness probes for health monitoring
# - Init containers for schema initialization
# - ConfigMaps for configuration management
# - Secrets for credentials
# - Anti-affinity for high availability

apiVersion: v1
kind: Namespace
metadata:
  name: bizra-genesis
  labels:
    app.kubernetes.io/name: bizra-genesis-node
    app.kubernetes.io/part-of: bizra-platform

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: bizra-genesis
type: Opaque
stringData:
  POSTGRES_USER: bizra_user
  POSTGRES_PASSWORD: CHANGE_ME_IN_PRODUCTION  # Use external secret management
  POSTGRES_DB: bizra_genesis

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: bizra-genesis
data:
  postgresql.conf: |
    # BIZRA Genesis Node PostgreSQL Configuration
    # Performance tuning for consensus workload

    # Connection Settings
    max_connections = 200
    superuser_reserved_connections = 3

    # Memory Settings
    shared_buffers = 2GB
    effective_cache_size = 6GB
    work_mem = 16MB
    maintenance_work_mem = 512MB

    # Checkpoint Settings
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    checkpoint_timeout = 15min
    max_wal_size = 4GB
    min_wal_size = 1GB

    # Query Planner
    random_page_cost = 1.1  # For SSD
    effective_io_concurrency = 200

    # Write-Ahead Log
    wal_level = replica
    max_wal_senders = 3
    wal_keep_size = 1GB

    # Logging
    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_line_prefix = '%m [%p] %u@%d '
    log_statement = 'ddl'
    log_duration = off
    log_min_duration_statement = 1000  # Log queries > 1s

    # Statistics
    track_activities = on
    track_counts = on
    track_io_timing = on
    track_functions = all

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bizra-genesis
  labels:
    app: postgres
    component: database
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: postgres
    component: database

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-lb
  namespace: bizra-genesis
  labels:
    app: postgres
    component: database
spec:
  type: LoadBalancer  # For external access (dev/staging only)
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: postgres
    component: database

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bizra-genesis
  labels:
    app: postgres
    component: database
    version: "15"
spec:
  serviceName: postgres
  replicas: 1  # For production, use 3 with replication
  selector:
    matchLabels:
      app: postgres
      component: database

  template:
    metadata:
      labels:
        app: postgres
        component: database
        version: "15"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"  # postgres_exporter

    spec:
      # Security context
      securityContext:
        fsGroup: 999  # postgres group
        runAsUser: 999  # postgres user
        runAsNonRoot: true

      # Anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - postgres
                topologyKey: kubernetes.io/hostname

      # Init containers
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          securityContext:
            runAsUser: 0  # Run as root for permission setup

      # Main containers
      containers:
        # PostgreSQL
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "-E UTF8 --locale=C"

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          # Resource limits
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"

          # Health checks
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Volumes
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
            - name: dshm
              mountPath: /dev/shm

        # PostgreSQL Exporter (Prometheus metrics)
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent

          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATA_SOURCE_URI
                  optional: true
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 30
            periodSeconds: 30

      # Volumes
      volumes:
        - name: postgres-config
          configMap:
            name: postgres-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

  # Volume claim templates
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: postgres
          component: database
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd  # Use your storage class
        resources:
          requests:
            storage: 100Gi  # Adjust based on needs

---
# PersistentVolumeClaim for backups
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  namespace: bizra-genesis
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 200Gi

---
# CronJob for automated backups
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: bizra-genesis
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:15-alpine
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_DB
              command:
                - /bin/sh
                - -c
                - |
                  export PGPASSWORD=$POSTGRES_PASSWORD
                  BACKUP_FILE="/backup/bizra-genesis-$(date +%Y%m%d-%H%M%S).sql.gz"
                  pg_dump -h postgres -U $POSTGRES_USER -d $POSTGRES_DB | gzip > $BACKUP_FILE
                  echo "Backup created: $BACKUP_FILE"
                  # Delete backups older than 30 days
                  find /backup -name "*.sql.gz" -mtime +30 -delete
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup
