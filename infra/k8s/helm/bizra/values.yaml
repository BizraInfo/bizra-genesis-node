# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  BIZRA GENESIS NODE - HELM VALUES                                       ║
# ║  Comprehensive configuration for production deployment                  ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# Global configuration
global:
  # Application metadata
  name: bizra-genesis-node
  namespace: bizra-production
  environment: production

  # Image configuration
  image:
    registry: docker.io
    repository: bizra/bizra-genesis-node
    tag: "v1.0.0"
    pullPolicy: Always
    pullSecrets: []

  # Service account configuration
  serviceAccount:
    create: true
    name: bizra-genesis-node-sa
    annotations: {}

# Application configuration
application:
  # Replica count
  replicaCount: 3

  # Resource limits and requests
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    readOnlyRootFilesystem: true

  # Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Health checks
  healthCheck:
    enabled: true
    livenessProbe:
      httpGet:
        path: /health/live
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: /health/ready
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  # Environment variables
  env:
    # Application settings
    RUST_LOG: "info,bizra_genesis_node=debug,sqlx=warn,tower_http=debug"
    RUST_BACKTRACE: "1"
    NODE_ENV: "production"

    # Consensus configuration
    IHSAN_FLOOR: "0.85"
    CONSENSUS_TIMEOUT_MS: "5000"
    THOMPSON_INITIAL_ALPHA: "1.0"
    THOMPSON_INITIAL_BETA: "1.0"

    # Genesis validation
    GENESIS_ENABLED: "true"
    GENESIS_MIN_ALIGNMENT: "0.70"

    # Performance optimization
    ENABLE_AVX2: "true"
    ENABLE_AVX512: "false"
    USE_MIMALLOC: "true"
    RAYON_NUM_THREADS: "8"
    TOKIO_WORKER_THREADS: "16"

    # Observability
    METRICS_ENABLED: "true"
    METRICS_PORT: "9090"
    HEALTH_CHECK_PORT: "8080"
    TRACING_ENABLED: "true"

# Database configuration
database:
  enabled: true
  type: postgresql
  host: ""
  port: 5432
  database: bizra
  username: ""
  password: ""
  sslMode: require
  connectionPool:
    maxConnections: 20
    minConnections: 5
    acquireTimeoutMs: 60000
    idleTimeoutMs: 300000

# Redis configuration
redis:
  enabled: true
  host: ""
  port: 6379
  password: ""
  database: 0
  connectionPool:
    maxConnections: 10
    minConnections: 2

# External APIs
apis:
  anthropic:
    apiKey: ""
    baseUrl: "https://api.anthropic.com"
    timeout: 30000
    retryAttempts: 3
  openai:
    apiKey: ""
    baseUrl: "https://api.openai.com/v1"
    timeout: 30000
    retryAttempts: 3

# Service configuration
service:
  type: ClusterIP
  ports:
    http:
      port: 80
      targetPort: 3000
      protocol: TCP
    metrics:
      port: 9090
      targetPort: 9090
      protocol: TCP
    health:
      port: 8080
      targetPort: 8080
      protocol: TCP
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/health/ready"

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.bizra.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bizra-tls-cert
      hosts:
        - api.bizra.ai

# Istio service mesh configuration
istio:
  enabled: true
  gateway:
    enabled: true
    hosts:
      - api.bizra.ai
    tls:
      enabled: true
      secretName: bizra-tls-cert
  virtualService:
    enabled: true
    hosts:
      - api.bizra.ai
    gateways:
      - bizra-genesis-gateway
    http:
      - match:
          - uri:
              prefix: "/api/v1"
          - uri:
              prefix: "/health"
          - uri:
              prefix: "/metrics"
        route:
          - destination:
              host: bizra-genesis-node-service
        timeout: 30s
        retries:
          attempts: 3
          perTryTimeout: 10s
        corsPolicy:
          allowOrigins:
            - "https://dashboard.bizra.ai"
            - "https://app.bizra.ai"
          allowMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowHeaders:
            - Authorization
            - Content-Type
            - X-Requested-With
          allowCredentials: true

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  customMetrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: 1000
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Node affinity and tolerations
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
            - key: node-type
              operator: In
              values:
                - compute-optimized
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - bizra-genesis-node
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "node-type"
    operator: "Equal"
    value: "compute-optimized"
    effect: "NoSchedule"

# Persistent storage
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 100Gi
  storageClass: fast-ssd
  mountPath: /app/data

# Monitoring and logging
monitoring:
  prometheus:
    enabled: true
    scrape: true
    port: 9090
    path: /metrics
    interval: 30s
    timeout: 10s

  grafana:
    enabled: false
    dashboards:
      - name: bizra-overview
        configMap: bizra-grafana-dashboards

# Logging configuration
logging:
  level: info
  format: json
  outputs:
    - stdout
    - file
  file:
    path: /app/logs
    maxSize: 100Mi
    maxFiles: 5

# Backup configuration
backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 30
  storage:
    type: s3
    bucket: bizra-backups
    region: us-east-1

# Security configuration
security:
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                name: istio-system
          - podSelector:
              matchLabels:
                app: istio-ingressgateway
        ports:
          - protocol: TCP
            port: 3000
          - protocol: TCP
            port: 9090
          - protocol: TCP
            port: 8080
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                name: kube-system
        ports:
          - protocol: UDP
            port: 53

# Resource quotas and limits
resourceQuota:
  enabled: false
  requests:
    cpu: 8
    memory: 32Gi
  limits:
    cpu: 16
    memory: 64Gi

# Horizontal Pod Autoscaler resource metrics
metrics:
  enabled: true
  server:
    enabled: true
    port: 8443
    tls:
      enabled: true
  apiserver:
    enabled: true
  controllerManager:
    enabled: true
  scheduler:
    enabled: true

# Custom configuration overrides
extraConfig: {}

# Additional environment variables
extraEnvVars: []

# Additional volumes
extraVolumes: []

# Additional volume mounts
extraVolumeMounts: []

# Additional containers
extraContainers: []

# Additional init containers
extraInitContainers: []

# Additional ports
extraPorts: []

# Additional labels
extraLabels: {}

# Additional annotations
extraAnnotations: {}

# Node selector
nodeSelector: {}

# Priority class
priorityClassName: ""

# Runtime class
runtimeClassName: ""

# Pod security standards
podSecurityStandards:
  enabled: true
  level: restricted
