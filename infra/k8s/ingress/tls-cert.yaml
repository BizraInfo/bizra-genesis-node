# ═══════════════════════════════════════════════════════════════════════════
# BIZRA GENESIS NODE - TLS/SSL CERTIFICATES
# Let's Encrypt certificates with cert-manager
# ═══════════════════════════════════════════════════════════════════════════

---
# ─────────────────────────────────────────────────────────────────────────────
# CERT-MANAGER NAMESPACE
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager

---
# ─────────────────────────────────────────────────────────────────────────────
# CLUSTER ISSUER (Let's Encrypt Production)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production server
    server: https://acme-v02.api.letsencrypt.org/directory

    # Email for certificate expiration notifications
    email: devops@bizra.ai

    # Private key secret
    privateKeySecretRef:
      name: letsencrypt-prod-key

    # HTTP-01 challenge solver
    solvers:
      - http01:
          ingress:
            class: nginx
        selector:
          dnsNames:
            - bizra.ai
            - www.bizra.ai
            - api.bizra.ai
            - app.bizra.ai

      # DNS-01 challenge solver (for wildcard certificates)
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z123456ABCDEF  # Replace with actual hosted zone ID
        selector:
          dnsNames:
            - '*.bizra.ai'

---
# ─────────────────────────────────────────────────────────────────────────────
# CLUSTER ISSUER (Let's Encrypt Staging - for testing)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: devops@bizra.ai
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# ─────────────────────────────────────────────────────────────────────────────
# CERTIFICATE FOR MAIN DOMAIN
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bizra-tls
  namespace: bizra-production
spec:
  secretName: bizra-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - bizra.ai
    - www.bizra.ai
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048

---
# ─────────────────────────────────────────────────────────────────────────────
# CERTIFICATE FOR API SUBDOMAIN
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-bizra-tls
  namespace: bizra-production
spec:
  secretName: api-bizra-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - api.bizra.ai
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048

---
# ─────────────────────────────────────────────────────────────────────────────
# CERTIFICATE FOR APP SUBDOMAIN
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-bizra-tls
  namespace: bizra-production
spec:
  secretName: app-bizra-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - app.bizra.ai
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048

---
# ─────────────────────────────────────────────────────────────────────────────
# WILDCARD CERTIFICATE (optional, for all subdomains)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-bizra-tls
  namespace: bizra-production
spec:
  secretName: wildcard-bizra-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - '*.bizra.ai'
    - bizra.ai
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048

---
# ─────────────────────────────────────────────────────────────────────────────
# INGRESS FOR MAIN APPLICATION
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bizra-ingress
  namespace: bizra-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Security headers
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

    # HSTS (HTTP Strict Transport Security)
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"

    # Additional security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";

    # Rate limiting (global)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # Proxy configuration
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

spec:
  tls:
    - hosts:
        - bizra.ai
        - www.bizra.ai
      secretName: bizra-tls-secret

    - hosts:
        - api.bizra.ai
      secretName: api-bizra-tls-secret

    - hosts:
        - app.bizra.ai
      secretName: app-bizra-tls-secret

  rules:
    # Main website
    - host: bizra.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    # www redirect to apex
    - host: www.bizra.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    # API subdomain
    - host: api.bizra.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bizra-genesis-node
                port:
                  number: 3000

    # App subdomain (dashboard)
    - host: app.bizra.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

---
# ─────────────────────────────────────────────────────────────────────────────
# INGRESS FOR OBSERVABILITY TOOLS
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-ingress
  namespace: observability
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Basic auth for observability tools
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: observability-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "BIZRA Observability"

spec:
  tls:
    - hosts:
        - observability.bizra.ai
        - grafana.bizra.ai
        - prometheus.bizra.ai
      secretName: observability-tls-secret

  rules:
    # Grafana
    - host: grafana.bizra.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-stack-grafana
                port:
                  number: 80

    # Prometheus
    - host: prometheus.bizra.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-stack-kube-prom-prometheus
                port:
                  number: 9090

    # Jaeger
    - host: observability.bizra.ai
      http:
        paths:
          - path: /jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger-query
                port:
                  number: 16686

          # Loki
          - path: /loki
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100

---
# ─────────────────────────────────────────────────────────────────────────────
# BASIC AUTH SECRET FOR OBSERVABILITY
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: observability-basic-auth
  namespace: observability
type: Opaque
data:
  # Generated with: htpasswd -nb admin <password> | base64
  # Default: admin / changeme
  # CHANGE THIS IN PRODUCTION!
  auth: YWRtaW46JGFwcjEkSDY1dnpiUTAkWEt4QTlFVVJ0L2JZL2s0WGJoQWFtMAo=
