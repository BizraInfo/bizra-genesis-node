# ═══════════════════════════════════════════════════════════════════════════
# BIZRA GENESIS NODE - PROMETHEUS STACK HELM VALUES
# Configuration for kube-prometheus-stack
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# GLOBAL SETTINGS
# ─────────────────────────────────────────────────────────────────────────────

fullnameOverride: prometheus-stack

# ─────────────────────────────────────────────────────────────────────────────
# PROMETHEUS
# ─────────────────────────────────────────────────────────────────────────────

prometheus:
  enabled: true

  prometheusSpec:
    # Retention
    retention: ${retention_days}d
    retentionSize: "45GB"

    # Resources
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 8Gi

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: ${storage_size}Gi

    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # External labels
    externalLabels:
      cluster: bizra-genesis-node
      environment: ${environment}

    # Scrape configuration
    scrapeInterval: 30s
    evaluationInterval: 30s

    # Additional scrape configs
    additionalScrapeConfigs:
      - job_name: 'bizra-genesis-node'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - bizra-production
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

# ─────────────────────────────────────────────────────────────────────────────
# GRAFANA
# ─────────────────────────────────────────────────────────────────────────────

grafana:
  enabled: true

  adminPassword: ${grafana_admin_password}

  # Persistence
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Plugins
  plugins:
    - grafana-piechart-panel
    - grafana-clock-panel
    - grafana-simple-json-datasource
    - camptocamp-prometheus-alertmanager-datasource

  # Datasources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-stack-kube-prom-prometheus:9090
          access: proxy
          isDefault: true
        - name: AlertManager
          type: camptocamp-prometheus-alertmanager-datasource
          url: http://prometheus-stack-kube-prom-alertmanager:9093
          access: proxy

  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
        - name: 'bizra'
          orgId: 1
          folder: 'BIZRA'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/bizra

  # Grafana.ini configuration
  grafana.ini:
    server:
      domain: grafana.bizra.ai
      root_url: "https://grafana.bizra.ai"
    analytics:
      check_for_updates: false
      reporting_enabled: false
    security:
      disable_gravatar: true
    users:
      viewers_can_edit: false
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# ALERTMANAGER
# ─────────────────────────────────────────────────────────────────────────────

alertmanager:
  enabled: true

  alertmanagerSpec:
    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # External URL
    externalUrl: https://alertmanager.bizra.ai

# ─────────────────────────────────────────────────────────────────────────────
# NODE EXPORTER
# ─────────────────────────────────────────────────────────────────────────────

nodeExporter:
  enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# KUBE STATE METRICS
# ─────────────────────────────────────────────────────────────────────────────

kube-state-metrics:
  enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ─────────────────────────────────────────────────────────────────────────────
# PROMETHEUS OPERATOR
# ─────────────────────────────────────────────────────────────────────────────

prometheusOperator:
  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Admission webhooks
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# DEFAULT RULES
# ─────────────────────────────────────────────────────────────────────────────

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
