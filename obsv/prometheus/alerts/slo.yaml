groups:
- name: api-slo
  rules:
  - alert: APIErrorBudgetBurnFast
    expr: (sum(rate(http_requests_total{service="api",status=~"5.."}[5m])) /
           sum(rate(http_requests_total{service="api"}[5m]))) > (0.01 * 14)
    for: 5m
    labels: { severity: critical }
    annotations: { runbook: "runbooks/api-slo.md#burn-rate" }

  - alert: APIErrorBudgetBurnSlow
    expr: (sum(rate(http_requests_total{service="api",status=~"5.."}[1h])) /
           sum(rate(http_requests_total{service="api"}[1h]))) > (0.01 * 6)
    for: 2h
    labels: { severity: warning }
    annotations: { runbook: "runbooks/api-slo.md#burn-rate" }

  - alert: APIP95LatencyHigh
    expr: histogram_quantile(0.95, sum by (le)
          (rate(http_request_duration_seconds_bucket{service="api"}[5m]))) > 0.2
    for: 10m
    labels: { severity: critical }
    annotations: { runbook: "runbooks/api-latency.md" }
