# BIZRA Genesis Node - cargo-deny Configuration
# Elite security & compliance standards for Rust dependencies
# Enforces: License compliance, security advisories, banned crates, source verification

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# BIZRA license policy: MIT, Apache-2.0, BSD-* allowed
# GPL-3.0, AGPL-3.0 denied (copyleft incompatible with commercial use)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "0BSD",
    "Zlib",
    "Unlicense",
]
deny = [
    "GPL-3.0",
    "AGPL-3.0",
]
copyleft = "deny"
allow-osi-fsf-free = "neither"
default = "deny"
confidence-threshold = 0.8
exceptions = [
    # Allow Ring (ISC + Additional permissions)
    { allow = ["ISC", "OpenSSL"], name = "ring" },
]

[[licenses.clarify]]
name = "ring"
expression = "ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Known vulnerable or deprecated crates
    { name = "openssl", wrappers = [] },  # Use rustls instead
    { name = "native-tls", wrappers = [] },  # Use rustls instead
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
