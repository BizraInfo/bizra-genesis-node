[workspace]
members = [
    "bizra-moe",
]

[package]
name = "bizra-genesis-node"
version = "1.0.0"
edition = "2021"
authors = ["BIZRA Development Team <dev@bizra.ai>"]
description = "BIZRA Genesis Node - Professional Elite Implementation"
license = "MIT"

[dependencies]
# Core Foundation
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"  # For sovereign model stack configuration
tracing = { version = "0.1", features = ["log"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Performance Excellence
rayon = "1.8"
parking_lot = "0.12"
mimalloc = { version = "0.1", default-features = false }
simd-json = { version = "0.13", optional = true }

# Blockchain & Cryptography
ed25519-dalek = "2.1"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
ring = "0.17"
hex = "0.4"
ciborium = "0.2"  # Deterministic CBOR serialization
bigdecimal = "0.4"

# Networking Excellence
libp2p = "0.53"
quinn = "0.11"  # Updated from 0.10 to fix ring vulnerability RUSTSEC-2025-0009
tonic = "0.10"
hyper = { version = "1.0", features = ["full"] }
axum = "0.7"
utoipa = { version = "4.2", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }
reqwest = { version = "0.11", features = ["json", "stream"] }  # For AI model provider APIs

# WebSocket Support
tokio-tungstenite = "0.21"
futures-util = "0.3"
aes-gcm = "0.10"
base64 = "0.21"
tokio-stream = "0.1"

# Database Excellence
rocksdb = "0.21"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "migrate", "uuid", "chrono", "bigdecimal"] }  # Updated from 0.7 to fix RUSTSEC-2024-0363
redis = { version = "1.0.0-rc.4", features = ["tokio-comp", "connection-manager"] }

# Auth & Security
bcrypt = "0.15"
jsonwebtoken = "9.2"
validator = { version = "0.19", features = ["derive"] }
regex = "1.10"
lazy_static = "1.4"

# Type generation for TypeScript frontend
ts-rs = "7.1"
tower_governor = "0.3"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
totp-rs = "5.5"
base32 = "0.5"
urlencoding = "2.1"

# AI/ML Integration (temporarily disabled due to rand version conflicts)
# candle-core = "0.2"
# tokenizers = "0.15"
# ort = "1.16"

# Monitoring & Metrics
prometheus = "0.14"  # Updated from 0.13 to fix protobuf vulnerability RUSTSEC-2024-0437
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"

# Consensus & Orchestration
rand = "0.9"
rand_distr = "0.5"
hashbrown = "0.14"
bytes = "1.5"
cfg-if = "1.0"
crossbeam-channel = "0.5"
once_cell = "1.19"
futures = "0.3"
fastrand = "2.0"
bizra-moe = { path = "bizra-moe" }

# CLI Tools
colored = "2.1"
dialoguer = "0.11"
indicatif = "0.17"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"
quickcheck = "1.0"
tower = "0.4"  # For telemetry HTTP testing
tempfile = "3.8"  # For validation API testing
http = "1.0"  # For axum request testing
serde_yaml = "0.9"  # For SLO validation tests

[features]
default = ["simd"]
simd = ["dep:simd-json"]
avx2 = []
avx512 = []
prusti = []  # Enable formal verification with Prusti
database = []  # Enable database persistence layer (requires PostgreSQL + Redis)

[profile.release]
opt-level = 3
lto = false  # Disabled LTO - Windows linker crashes even with thin
codegen-units = 16  # Use parallel codegen for faster builds
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

# Criterion benchmark configuration
[[bench]]
name = "moe_benchmarks"
harness = false
path = "bizra-moe/benches/moe_benchmarks.rs"

[[bench]]
name = "api_performance"
harness = false
path = "benches/api_performance.rs"

[[bench]]
name = "routing"
harness = false
path = "benches/routing.rs"

[[bench]]
name = "consensus"
harness = false
path = "benches/consensus.rs"

[[bench]]
name = "agent_performance"
harness = false
path = "benches/agent_performance.rs"
