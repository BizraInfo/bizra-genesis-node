[package]
name = "synthesis_orchestrator"
version = "0.1.0"
edition = "2021"

[features]
default = ["simd"]
simd = ["dep:simd-json"]
avx2 = []
avx512 = []
io-uring = ["dep:io-uring"]

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = { version = "0.13", optional = true }

# Async
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time"] }
bytes = "1.7"
async-trait = "0.1"

# AI Backend
bizra-moe = { path = "./bizra-moe" }

# Randomness
rand = "0.8"
rand_distr = "0.4"

# Crypto
ring = "0.17"
blake3 = "1.5"
hex = "0.4"

# Utilities
uuid = { version = "1.11", features = ["v4"] }
thiserror = "1.0"
cfg-if = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(all(target_os = "linux"))'.dependencies]
io-uring = { version = "0.6", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "synthesis_orchestrator"
path = "src/main.rs"

[[example]]
name = "moe_basic"
path = "examples/moe_basic.rs"

[[example]]
name = "moe_real"
path = "examples/moe_real.rs"

[[example]]
name = "moe_hybrid"
path = "examples/moe_hybrid.rs"

[[example]]
name = "pat_agents_demo"
path = "examples/pat_agents_demo.rs"

[[example]]
name = "full_ecosystem_demo"
path = "examples/full_ecosystem_demo.rs"

[[example]]
name = "cli_demo"
path = "examples/cli_demo.rs"
