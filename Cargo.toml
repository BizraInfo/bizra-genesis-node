[workspace]
members = [
    ".",
    "bizra-moe",
]

[package]
name = "bizra-genesis-node"
version = "1.0.0"
edition = "2021"
authors = ["BIZRA Development Team <dev@bizra.ai>"]
description = "BIZRA Genesis Node - Professional Elite Implementation"
license = "MIT"

[dependencies]
# Core Foundation
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", features = ["log"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Performance Excellence
rayon = "1.8"
parking_lot = "0.12"
mimalloc = { version = "0.1", default-features = false }
simd-json = { version = "0.13", optional = true }

# Blockchain & Cryptography
ed25519-dalek = "2.1"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
ring = "0.17"
hex = "0.4"
ciborium = "0.2"  # Deterministic CBOR serialization

# Networking Excellence
libp2p = "0.53"
quinn = "0.11"  # Updated from 0.10 to fix ring vulnerability RUSTSEC-2025-0009
tonic = "0.10"
hyper = { version = "1.0", features = ["full"] }
axum = "0.7"
utoipa = { version = "4.2", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# Database Excellence
rocksdb = "0.21"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "migrate"] }  # Updated from 0.7 to fix RUSTSEC-2024-0363
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# AI/ML Integration (temporarily disabled due to rand version conflicts)
# candle-core = "0.2"
# tokenizers = "0.15"
# ort = "1.16"

# Monitoring & Metrics
prometheus = "0.14"  # Updated from 0.13 to fix protobuf vulnerability RUSTSEC-2024-0437
metrics = "0.21"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"

# Consensus & Orchestration
rand = "0.9"
rand_distr = "0.5"
hashbrown = "0.14"
bytes = "1.5"
cfg-if = "1.0"
crossbeam-channel = "0.5"
once_cell = "1.19"
bizra-moe = { path = "bizra-moe" }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
quickcheck = "1.0"
tower = "0.4"  # For telemetry HTTP testing
tempfile = "3.8"  # For validation API testing

[features]
default = ["simd"]
simd = ["dep:simd-json"]
avx2 = []
avx512 = []
prusti = []  # Enable formal verification with Prusti

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
