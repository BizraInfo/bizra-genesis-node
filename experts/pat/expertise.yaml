# Core understanding of PAT architecture
knowledge:
  agents:
    - name: MasterReasoner
      model: deepseek-r1:7b
      backend: ollama
      purpose: "Strategic thinking, complex analysis, orchestration"
      system_prompt_location: "backend/src/lib/agents/pat.rs:42-52"
      
    - name: MemoryArchitect
      model: qwen2.5:7b
      backend: ollama
      purpose: "Knowledge organization, finding connections, recall"
      system_prompt_location: "backend/src/lib/agents/pat.rs:53-58"
      
    - name: CreativeSynthesizer
      model: qwen2.5:7b
      backend: ollama
      purpose: "Writing, brainstorming, ideation"
      system_prompt_location: "backend/src/lib/agents/pat.rs:59-63"
      
    - name: DataAnalyzer
      model: mistral:7b
      backend: ollama
      purpose: "Data analysis, pattern recognition, insights"
      system_prompt_location: "backend/src/lib/agents/pat.rs:64-68"
      
    - name: Communicator
      model: mistral:7b
      backend: ollama
      purpose: "Professional messaging, emails, presentations"
      system_prompt_location: "backend/src/lib/agents/pat.rs:69-73"
      
    - name: ExecutionPlanner
      model: agentflow-7b
      backend: lmstudio
      purpose: "Task breakdown, scheduling, workflow orchestration"
      system_prompt_location: "backend/src/lib/agents/pat.rs:74-82"
      
    - name: EthicsGuardian
      model: qwen2.5:7b
      backend: ollama
      purpose: "Safety compliance, Ihsan checks, ethical review"
      system_prompt_location: "backend/src/lib/agents/pat.rs:83-88"

  orchestration:
    pattern: "MasterReasoner coordinates, specialists execute"
    selection_algorithm: "backend/src/lib/agents/pat.rs:select_primary_agent"
    factors:
      - user_intent
      - task_complexity
      - user_preference
      - historical_performance

  memory_architecture:
    episodic: "Redis - recent conversation history"
    semantic: "PostgreSQL + pgvector - long-term knowledge"
    procedural: "JSON profiles - learned user preferences"

# Patterns I've observed
patterns:
  - name: "intent_routing"
    description: "Creative intent → CreativeSynthesizer, Analysis → DataAnalyzer"
    confidence: 0.92
    
  - name: "complexity_escalation"
    description: "High complexity always routes to MasterReasoner first"
    confidence: 0.95
    
  - name: "ethics_passthrough"
    description: "EthicsGuardian reviews all outputs before user delivery"
    confidence: 0.88

