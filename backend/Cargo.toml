[package]
name = "bizra-node0"
version = "1.0.0"
edition = "2021"
authors = ["BIZRA Foundation <dev@bizra.foundation>"]
description = "BIZRA Genesis Node - Sovereign AI Network Reference Implementation"
license = "MIT"
repository = "https://github.com/bizra/bizra-genesis-node"

[[bin]]
name = "apiserver"
path = "src/main.rs"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1.35", features = ["full"] }
tower = { version = "0.4", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "aio"] }

# HTTP Client (for Ollama)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
rand = "0.8"
md-5 = "0.10"

# Concurrency
parking_lot = "0.12"
dashmap = "6.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Security
bcrypt = "0.15"
jsonwebtoken = "9.2"

# System Info
sysinfo = "0.30"

# API Documentation
utoipa = { version = "4.2", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "core_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
