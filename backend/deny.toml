# BIZRA Node0 - Cargo Deny Configuration
# Elite Dependency Management: License & Security Enforcement
# Professional Standard: Zero-tolerance for problematic dependencies

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# ============================================
# ADVISORIES - Security Vulnerability Check
# ============================================
[advisories]
db-path = "~/.cargo/advisory-db"
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"

# Allow specific advisories if we've verified they don't affect us
ignore = [
    # RSA timing attack - only affects MySQL connections, we use PostgreSQL
    # No fix available upstream. sqlx-mysql is pulled as unused optional feature
    # See: https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",
]

# ============================================
# LICENSES - Open Source Compliance
# ============================================
[licenses]
unlicensed = "deny"
copyleft = "warn"
default = "deny"

# Allowed licenses for BIZRA (permissive open source)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-DFS-2016",
]

# Explicitly denied licenses
deny = [
    "GPL-3.0",
    "AGPL-3.0",
]

# Clarifications for specific crates
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

# ============================================
# BANS - Forbidden Dependencies
# ============================================
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Deny specific crates (security/sovereignty concerns)
deny = [
    # Cloud AI SDK crates (sovereignty violation)
    { name = "openai", wrappers = [] },
    { name = "anthropic", wrappers = [] },
    { name = "async-openai", wrappers = [] },
    
    # Known problematic crates
    { name = "openssl", wrappers = ["openssl-sys"] },
]

# Allow specific duplicates if unavoidable
skip = [
    # Example: { name = "syn", version = "1" },
]

# Tree-skip for transitive duplicates
skip-tree = [
    # Example: { name = "windows-sys", version = "0.45" },
]

# ============================================
# SOURCES - Crate Registry Control
# ============================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allow specific private registries if needed
# allow-registry = [
#     "https://github.com/rust-lang/crates.io-index",
#     "https://my-private-registry.example.com/index",
# ]

# Allow specific git sources
allow-git = [
    # Example: "https://github.com/example/private-crate",
]

# ============================================
# OUTPUT - Reporting Configuration
# ============================================
[output]
feature-depth = 1
