<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bizraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0f172a"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#bizraGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- BIZRA "B" stylized as neural network -->
  <g filter="url(#glow)">
    <!-- Main B shape -->
    <path d="M 30 25 L 30 75 L 55 75 Q 70 75 70 62.5 Q 70 52 55 50 Q 68 48 68 37.5 Q 68 25 55 25 Z" 
          fill="none" stroke="url(#bizraGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Neural connection dots -->
    <circle cx="30" cy="25" r="3" fill="#06b6d4"/>
    <circle cx="30" cy="50" r="3" fill="#8b5cf6"/>
    <circle cx="30" cy="75" r="3" fill="#6366f1"/>
    <circle cx="55" cy="25" r="3" fill="#06b6d4"/>
    <circle cx="55" cy="50" r="3" fill="#8b5cf6"/>
    <circle cx="55" cy="75" r="3" fill="#6366f1"/>
    <circle cx="68" cy="37" r="2" fill="#fbbf24"/>
    <circle cx="70" cy="62" r="2" fill="#fbbf24"/>
    
    <!-- Pulse ring -->
    <circle cx="50" cy="50" r="35" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
