# Dependabot configuration for automated dependency updates
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Cargo (Rust) dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "cargo"
      include: "scope"
    reviewers:
      - "BizraInfo/core-team"
    ignore:
      # Ignore major version updates that may require code changes
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Cargo (Rust) dependencies for bizra-moe workspace
  - package-ecosystem: "cargo"
    directory: "/bizra-moe"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
      - "bizra-moe"
    commit-message:
      prefix: "cargo(moe)"
      include: "scope"
    reviewers:
      - "BizraInfo/core-team"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # NPM (Node.js) dependencies - if package.json exists
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "npm"
      include: "scope"
    reviewers:
      - "BizraInfo/core-team"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "BizraInfo/core-team"
