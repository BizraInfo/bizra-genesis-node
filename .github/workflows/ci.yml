# BIZRA Genesis Node - Production-Grade CI/CD Pipeline
# Deterministic, Performance-First CI with Security Automation

name: Production CI/CD

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # ============================================================================
  # Phase 1: Test - Format, Lint, Security, Unit/Integration Tests
  # ============================================================================
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🦀 Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: 🚀 Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: 📦 Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 🎨 Format check
        run: cargo fmt --all -- --check

      - name: 📋 Clippy lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: 🛡️ Security audit
        uses: actions-rs/cargo@v1
        with:
          command: audit
        continue-on-error: true

      - name: 🧪 Run tests
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --workspace --all-features --no-fail-fast

      - name: 📤 Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            target/debug/
            !target/debug/deps
            !target/debug/build
          retention-days: 7

  # ============================================================================
  # Phase 2: Benchmarks - Run Criterion benchmarks and collect evidence
  # ============================================================================
  benchmarks:
    name: ⚡ Benchmarks
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🦀 Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: 🚀 Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: 📦 Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: 🏃 Run benchmarks
        env:
          RUSTC_WRAPPER: sccache
        run: cargo bench --benches -- --noplot

      - name: 📊 Collect benchmark evidence
        run: |
          mkdir -p evidence/criterion
          if [ -d "target/criterion" ]; then
            cp -r target/criterion/* evidence/criterion/
          fi

      - name: 📤 Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: criterion-evidence
          path: evidence/criterion
          retention-days: 90

  # ============================================================================
  # Phase 3: Performance Gate - Compare against baseline and block regressions
  # ============================================================================
  perf-gate:
    name: 🚦 Performance Gate
    needs: benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📥 Download current benchmark evidence
        uses: actions/download-artifact@v4
        with:
          name: criterion-evidence
          path: evidence/criterion

      - name: 📥 Download baseline (if exists)
        id: download-baseline
        uses: actions/download-artifact@v4
        with:
          name: baseline-criterion
          path: baseline/criterion
        continue-on-error: true

      - name: 📊 Compare benchmarks
        if: steps.download-baseline.outcome == 'success'
        run: |
          python scripts/compare_criterion.py \
            --baseline baseline/criterion \
            --current evidence/criterion \
            --threshold 0.10

      - name: ℹ️ No baseline available
        if: steps.download-baseline.outcome != 'success'
        run: |
          echo "⚠️ No baseline benchmark data found"
          echo "To enable performance regression detection:"
          echo "1. Run benchmarks on main branch"
          echo "2. Download criterion-evidence artifact"
          echo "3. Upload as 'baseline-criterion' to repository"
          echo ""
          echo "Current benchmarks will be available as criterion-evidence artifact"

  # ============================================================================
  # Phase 4: Load Test - Run k6 load tests and upload results
  # ============================================================================
  loadtest:
    name: 🔥 Load Test
    needs: perf-gate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Pull k6 Docker image
        run: docker pull grafana/k6:latest

      - name: 🔥 Run k6 load tests
        run: |
          docker run --rm \
            -v $(pwd)/tests/k6:/scripts \
            grafana/k6:latest run \
            --out json=/scripts/k6-results.json \
            /scripts/load_test.js

      - name: 📤 Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: tests/k6/k6-results.json
          retention-days: 30

  # ============================================================================
  # Phase 5: Release (Optional) - Only on main branch
  # ============================================================================
  release:
    name: 🚀 Release
    needs: [test, benchmarks, perf-gate, loadtest]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: 🚀 Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: 📦 Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: 🏗️ Build release binary
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release --workspace

      - name: 📤 Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            target/release/bizra-genesis-node
            target/release/bizra-moe
          retention-days: 90

  # ============================================================================
  # Final Gate: CI Complete
  # ============================================================================
  ci-complete:
    name: ✅ CI Complete
    needs: [test, benchmarks, perf-gate, loadtest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Check all jobs
        run: |
          echo "Test: ${{ needs.test.result }}"
          echo "Benchmarks: ${{ needs.benchmarks.result }}"
          echo "Perf Gate: ${{ needs.perf-gate.result }}"
          echo "Load Test: ${{ needs.loadtest.result }}"

          if [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.benchmarks.result }}" != "success" ]] || \
             [[ "${{ needs.perf-gate.result }}" != "success" ]] || \
             [[ "${{ needs.loadtest.result }}" != "success" ]]; then
            echo "❌ Required jobs failed"
            exit 1
          fi

      - name: ✅ Success
        run: |
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║  ✅ Production CI/CD Pipeline Passed                      ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
          echo "✅ Format check passed"
          echo "✅ Clippy lint passed"
          echo "✅ Security audit completed"
          echo "✅ All tests passed"
          echo "✅ Benchmarks completed"
          echo "✅ Performance gate passed"
          echo "✅ Load tests completed"
          echo ""
          echo "🎯 Ready for deployment! 🚀"
