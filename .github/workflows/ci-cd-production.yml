# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  BIZRA GENESIS NODE - CI/CD PRODUCTION PIPELINE                          ║
# ║  Professional Elite DevOps - Automated Testing & Deployment              ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: CI/CD Production Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: CODE QUALITY & LINTING
  # ═══════════════════════════════════════════════════════════════════════════
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Rust Format Check
        run: cargo fmt --all -- --check

      - name: Rust Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install Frontend Dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: TypeScript Type Check
        working-directory: apps/dashboard
        run: npm run type-check

      - name: ESLint
        working-directory: apps/dashboard
        run: npx eslint src --ext .ts,.tsx --max-warnings 0
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: RUST BACKEND TESTING
  # ═══════════════════════════════════════════════════════════════════════════
  backend-tests:
    name: Rust Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Rust project
        run: cargo build --verbose --all-features

      - name: Run Rust tests
        run: cargo test --verbose --all-features

      - name: Run Rust benchmarks (dry run)
        run: cargo bench --no-run --all-features

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: WEBSOCKET SERVER BUILD
  # ═══════════════════════════════════════════════════════════════════════════
  websocket-build:
    name: WebSocket Server Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build WebSocket server (no database)
        run: cargo build --release --example websocket_demo

      - name: Verify WebSocket binary
        run: |
          ls -lh target/release/examples/websocket_demo || \
          ls -lh target/release/examples/websocket_demo.exe

      - name: Upload WebSocket binary
        uses: actions/upload-artifact@v4
        with:
          name: websocket-server
          path: target/release/examples/websocket_demo*
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: FRONTEND BUILD & TESTING
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-build:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: TypeScript compilation check
        working-directory: apps/dashboard
        run: npm run type-check

      - name: Build production bundle
        working-directory: apps/dashboard
        run: npm run build

      - name: Verify build output
        working-directory: apps/dashboard
        run: |
          ls -lh dist/
          du -sh dist/

      - name: Run frontend tests (when available)
        working-directory: apps/dashboard
        run: npm test --if-present || echo "No tests configured yet"
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/dashboard/dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5: SECURITY AUDIT
  # ═══════════════════════════════════════════════════════════════════════════
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        working-directory: apps/dashboard
        run: npm audit --audit-level=high
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 6: PERFORMANCE BENCHMARKS
  # ═══════════════════════════════════════════════════════════════════════════
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run benchmarks
        run: cargo bench --all-features
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 7: DOCKER BUILD (Multi-stage)
  # ═══════════════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Multi-stage Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (if secrets available)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bizra-genesis-node:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 8: DEPLOYMENT TO STAGING (Auto on develop push)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [code-quality, backend-tests, frontend-build, websocket-build]
    environment:
      name: staging
      url: https://staging.bizra.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/dashboard/dist

      - name: Deploy to Vercel (Staging)
        if: env.VERCEL_TOKEN != ''
        working-directory: apps/dashboard
        run: |
          npx vercel --token=${{ secrets.VERCEL_TOKEN }} \
            --prod=false \
            --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 9: DEPLOYMENT TO PRODUCTION (Manual approval required)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [code-quality, backend-tests, frontend-build, websocket-build, security-audit]
    environment:
      name: production
      url: https://bizra.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/dashboard/dist

      - name: Deploy Frontend to Vercel (Production)
        if: env.VERCEL_TOKEN != ''
        working-directory: apps/dashboard
        run: |
          npx vercel --token=${{ secrets.VERCEL_TOKEN }} \
            --prod \
            --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        continue-on-error: true

      - name: Deploy WebSocket to Railway (Production)
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm i -g @railway/cli
          railway up --service websocket
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 10: NOTIFICATION & REPORTING
  # ═══════════════════════════════════════════════════════════════════════════
  notify:
    name: Build Status Notification
    runs-on: ubuntu-latest
    if: always()
    needs: [code-quality, backend-tests, frontend-build]
    steps:
      - name: Check build status
        run: |
          echo "Build completed!"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"

      - name: Create status badge
        run: |
          if [[ "${{ needs.frontend-build.result }}" == "success" ]] && \
             [[ "${{ needs.backend-tests.result }}" == "success" ]]; then
            echo "✅ All checks passed"
          else
            echo "❌ Some checks failed"
          fi
