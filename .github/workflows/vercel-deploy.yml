# ═══════════════════════════════════════════════════════════════════════════
# BIZRA Genesis Node - Vercel Deployment
# ═══════════════════════════════════════════════════════════════════════════
# 
# IMPORTANT: All GitHub Actions workflows are DISABLED to conserve minutes.
# Vercel automatically deploys when you push to GitHub (via Git integration).
# 
# To re-enable full CI/CD:
# 1. Fix GitHub billing at https://github.com/settings/billing
# 2. Move workflows from .github/workflows-disabled/ back to .github/workflows/
#
# ═══════════════════════════════════════════════════════════════════════════

name: Vercel Status

on:
  workflow_dispatch:  # Manual trigger only - no automatic runs

jobs:
  info:
    name: Deployment Info
    runs-on: ubuntu-latest
    if: false  # DISABLED - Vercel auto-deploys via Git integration
    steps:
      - run: echo "Check https://vercel.com/dashboard for deployment status"
