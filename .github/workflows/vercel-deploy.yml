name: Vercel Production Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # LINT AND TEST
  # ═══════════════════════════════════════════════════════════════════════
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install dashboard dependencies
        run: cd apps/dashboard && npm install

      - name: Lint dashboard
        run: cd apps/dashboard && npm run lint --if-present
        continue-on-error: true

      - name: Type check dashboard
        run: cd apps/dashboard && npm run type-check --if-present
        continue-on-error: true

      - name: Test dashboard
        run: cd apps/dashboard && npm test --if-present
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD
  # ═══════════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build dashboard
        run: npm run build:dashboard

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: apps/dashboard/dist
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════
  # DEPLOY TO VERCEL (Preview)
  # ═══════════════════════════════════════════════════════════════════════
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Preview deployment ready!\n\n🔗 **Preview URL**: ${{ steps.deploy.outputs.preview_url }}\n\n---\n*Deployed from commit: ${context.sha.substring(0, 7)}*`
            })

  # ═══════════════════════════════════════════════════════════════════════
  # DEPLOY TO VERCEL (Production)
  # ═══════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://bizra.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production_url=$url" >> $GITHUB_OUTPUT

      - name: Verify deployment
        run: |
          echo "Waiting 30 seconds for deployment to be ready..."
          sleep 30
          curl -f ${{ steps.deploy.outputs.production_url }}/health || echo "Health check endpoint not available"

      - name: Create deployment summary
        run: |
          echo "# 🚀 Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: ${{ steps.deploy.outputs.production_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${GITHUB_SHA:0:7}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment success
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: '${{ steps.deploy.outputs.production_url }}',
              description: 'Deployment succeeded',
              context: 'vercel/production'
            })

  # ═══════════════════════════════════════════════════════════════════════
  # POST-DEPLOYMENT VALIDATION
  # ═══════════════════════════════════════════════════════════════════════
  validate:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment propagation
        run: sleep 60

      - name: Test homepage
        run: |
          curl -f -I https://bizra.ai || exit 1
          echo "✅ Homepage is accessible"

      - name: Test landing page
        run: |
          curl -f -I https://bizra.ai/landing || exit 1
          echo "✅ Landing page is accessible"

      - name: Test API health (if available)
        run: |
          curl -f https://api.bizra.ai/health || echo "⚠️ API health endpoint not accessible (may be deployed separately)"

      - name: Check SSL certificate
        run: |
          echo | openssl s_client -servername bizra.ai -connect bizra.ai:443 2>/dev/null | openssl x509 -noout -dates
          echo "✅ SSL certificate is valid"

      - name: Performance check
        run: |
          response_time=$(curl -o /dev/null -s -w '%{time_total}\n' https://bizra.ai)
          echo "Response time: ${response_time}s"
          if (( $(echo "$response_time < 3.0" | bc -l) )); then
            echo "✅ Performance is acceptable"
          else
            echo "⚠️ Response time is slower than expected"
          fi

      - name: Create validation summary
        run: |
          echo "# ✅ Post-Deployment Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All validation checks passed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Homepage accessible" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Landing page accessible" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SSL certificate valid" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Performance within acceptable range" >> $GITHUB_STEP_SUMMARY
