# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  BIZRA GENESIS NODE - TEST COVERAGE GATES                                  ║
# ║  Enforces minimum coverage thresholds for merge approval                   ║
# ║  Professional Elite Quality Assurance Pipeline                             ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: Test Coverage Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Coverage thresholds (enforced as quality gates)
  MIN_LINE_COVERAGE: 60
  MIN_BRANCH_COVERAGE: 50
  MIN_FUNCTION_COVERAGE: 65
  # Target coverage (aspirational)
  TARGET_LINE_COVERAGE: 80
  TARGET_BRANCH_COVERAGE: 70
  TARGET_FUNCTION_COVERAGE: 80

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Rust Backend Coverage
  # ═══════════════════════════════════════════════════════════════════════════
  rust-coverage:
    name: Rust Backend Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Generate coverage report
        run: |
          cargo llvm-cov nextest \
            --all-features \
            --workspace \
            --lcov --output-path lcov.info \
            --json --output-path coverage.json

      - name: Generate HTML coverage report
        run: |
          cargo llvm-cov report \
            --html \
            --output-dir coverage-report

      - name: Parse coverage metrics
        id: coverage
        run: |
          # Extract coverage metrics from JSON
          LINE_COV=$(jq -r '.data[0].totals.lines.percent // 0' coverage.json 2>/dev/null || echo "0")
          BRANCH_COV=$(jq -r '.data[0].totals.branches.percent // 0' coverage.json 2>/dev/null || echo "0")
          FUNC_COV=$(jq -r '.data[0].totals.functions.percent // 0' coverage.json 2>/dev/null || echo "0")

          # Fallback: parse from lcov
          if [ "$LINE_COV" = "0" ]; then
            LINES_FOUND=$(grep -oP 'LF:\K\d+' lcov.info | awk '{sum += $1} END {print sum}')
            LINES_HIT=$(grep -oP 'LH:\K\d+' lcov.info | awk '{sum += $1} END {print sum}')
            if [ "$LINES_FOUND" -gt 0 ]; then
              LINE_COV=$(echo "scale=2; $LINES_HIT * 100 / $LINES_FOUND" | bc)
            fi
          fi

          echo "line_coverage=$LINE_COV" >> $GITHUB_OUTPUT
          echo "branch_coverage=$BRANCH_COV" >> $GITHUB_OUTPUT
          echo "function_coverage=$FUNC_COV" >> $GITHUB_OUTPUT

          echo "📊 Coverage Metrics:"
          echo "  Line Coverage: ${LINE_COV}%"
          echo "  Branch Coverage: ${BRANCH_COV}%"
          echo "  Function Coverage: ${FUNC_COV}%"

      - name: Coverage Quality Gate
        id: gate
        run: |
          LINE_COV="${{ steps.coverage.outputs.line_coverage }}"
          BRANCH_COV="${{ steps.coverage.outputs.branch_coverage }}"
          FUNC_COV="${{ steps.coverage.outputs.function_coverage }}"

          PASSED=true
          VIOLATIONS=""

          # Check minimum thresholds
          if (( $(echo "$LINE_COV < $MIN_LINE_COVERAGE" | bc -l) )); then
            VIOLATIONS="$VIOLATIONS\n❌ Line coverage ${LINE_COV}% below minimum ${MIN_LINE_COVERAGE}%"
            PASSED=false
          fi

          if (( $(echo "$BRANCH_COV < $MIN_BRANCH_COVERAGE" | bc -l) )); then
            VIOLATIONS="$VIOLATIONS\n❌ Branch coverage ${BRANCH_COV}% below minimum ${MIN_BRANCH_COVERAGE}%"
            PASSED=false
          fi

          if (( $(echo "$FUNC_COV < $MIN_FUNCTION_COVERAGE" | bc -l) )); then
            VIOLATIONS="$VIOLATIONS\n❌ Function coverage ${FUNC_COV}% below minimum ${MIN_FUNCTION_COVERAGE}%"
            PASSED=false
          fi

          # Check target thresholds (warnings only)
          WARNINGS=""
          if (( $(echo "$LINE_COV < $TARGET_LINE_COVERAGE" | bc -l) )); then
            WARNINGS="$WARNINGS\n⚠️ Line coverage ${LINE_COV}% below target ${TARGET_LINE_COVERAGE}%"
          fi

          if (( $(echo "$BRANCH_COV < $TARGET_BRANCH_COVERAGE" | bc -l) )); then
            WARNINGS="$WARNINGS\n⚠️ Branch coverage ${BRANCH_COV}% below target ${TARGET_BRANCH_COVERAGE}%"
          fi

          if (( $(echo "$FUNC_COV < $TARGET_FUNCTION_COVERAGE" | bc -l) )); then
            WARNINGS="$WARNINGS\n⚠️ Function coverage ${FUNC_COV}% below target ${TARGET_FUNCTION_COVERAGE}%"
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT

          if [ "$PASSED" = "false" ]; then
            echo -e "::error::Coverage Quality Gate FAILED$VIOLATIONS"
            exit 1
          fi

          echo "✅ Coverage Quality Gate PASSED"
          if [ -n "$WARNINGS" ]; then
            echo -e "::warning::Coverage targets not met:$WARNINGS"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-report
          path: |
            lcov.info
            coverage.json
            coverage-report/

      - name: Coverage Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const lineCov = '${{ steps.coverage.outputs.line_coverage }}';
            const branchCov = '${{ steps.coverage.outputs.branch_coverage }}';
            const funcCov = '${{ steps.coverage.outputs.function_coverage }}';
            const passed = '${{ steps.gate.outputs.passed }}';

            const statusIcon = passed === 'true' ? '✅' : '❌';
            const statusText = passed === 'true' ? 'PASSED' : 'FAILED';

            const body = `## ${statusIcon} Rust Coverage Report

            | Metric | Coverage | Minimum | Target | Status |
            |--------|----------|---------|--------|--------|
            | Lines | ${lineCov}% | ${process.env.MIN_LINE_COVERAGE}% | ${process.env.TARGET_LINE_COVERAGE}% | ${parseFloat(lineCov) >= parseFloat(process.env.MIN_LINE_COVERAGE) ? '✅' : '❌'} |
            | Branches | ${branchCov}% | ${process.env.MIN_BRANCH_COVERAGE}% | ${process.env.TARGET_BRANCH_COVERAGE}% | ${parseFloat(branchCov) >= parseFloat(process.env.MIN_BRANCH_COVERAGE) ? '✅' : '❌'} |
            | Functions | ${funcCov}% | ${process.env.MIN_FUNCTION_COVERAGE}% | ${process.env.TARGET_FUNCTION_COVERAGE}% | ${parseFloat(funcCov) >= parseFloat(process.env.MIN_FUNCTION_COVERAGE) ? '✅' : '❌'} |

            **Quality Gate:** ${statusText}

            > 📊 Full coverage report available in workflow artifacts`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ═══════════════════════════════════════════════════════════════════════════
  # Frontend Coverage
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test -- --coverage --passWithNoTests
        continue-on-error: true

      - name: Parse coverage metrics
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINE_COV=$(jq -r '.total.lines.pct // 0' coverage/coverage-summary.json)
            BRANCH_COV=$(jq -r '.total.branches.pct // 0' coverage/coverage-summary.json)
            FUNC_COV=$(jq -r '.total.functions.pct // 0' coverage/coverage-summary.json)
            STMT_COV=$(jq -r '.total.statements.pct // 0' coverage/coverage-summary.json)
          else
            echo "⚠️ No coverage report found"
            LINE_COV=0
            BRANCH_COV=0
            FUNC_COV=0
            STMT_COV=0
          fi

          echo "line_coverage=$LINE_COV" >> $GITHUB_OUTPUT
          echo "branch_coverage=$BRANCH_COV" >> $GITHUB_OUTPUT
          echo "function_coverage=$FUNC_COV" >> $GITHUB_OUTPUT
          echo "statement_coverage=$STMT_COV" >> $GITHUB_OUTPUT

          echo "📊 Frontend Coverage Metrics:"
          echo "  Statements: ${STMT_COV}%"
          echo "  Branches: ${BRANCH_COV}%"
          echo "  Functions: ${FUNC_COV}%"
          echo "  Lines: ${LINE_COV}%"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: apps/dashboard/coverage/

  # ═══════════════════════════════════════════════════════════════════════════
  # Coverage Trend Analysis
  # ═══════════════════════════════════════════════════════════════════════════
  coverage-trend:
    name: Coverage Trend Analysis
    runs-on: ubuntu-latest
    needs: [rust-coverage, frontend-coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts

      - name: Update coverage badge
        run: |
          RUST_COV="${{ needs.rust-coverage.outputs.line_coverage || '0' }}"

          # Determine badge color
          if (( $(echo "$RUST_COV >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$RUST_COV >= 60" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$RUST_COV >= 40" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          echo "Coverage: ${RUST_COV}% (${COLOR})"

      - name: Generate coverage trend report
        run: |
          mkdir -p evidence

          cat > evidence/coverage-trend.md << EOF
          # Coverage Trend Report

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Current Coverage

          ### Rust Backend
          - Line Coverage: ${{ needs.rust-coverage.outputs.line_coverage || 'N/A' }}%
          - Branch Coverage: ${{ needs.rust-coverage.outputs.branch_coverage || 'N/A' }}%
          - Function Coverage: ${{ needs.rust-coverage.outputs.function_coverage || 'N/A' }}%

          ### Frontend (React/TypeScript)
          - Line Coverage: ${{ needs.frontend-coverage.outputs.line_coverage || 'N/A' }}%
          - Branch Coverage: ${{ needs.frontend-coverage.outputs.branch_coverage || 'N/A' }}%
          - Function Coverage: ${{ needs.frontend-coverage.outputs.function_coverage || 'N/A' }}%

          ## Thresholds

          | Level | Line | Branch | Function |
          |-------|------|--------|----------|
          | Minimum (Gate) | ${MIN_LINE_COVERAGE}% | ${MIN_BRANCH_COVERAGE}% | ${MIN_FUNCTION_COVERAGE}% |
          | Target | ${TARGET_LINE_COVERAGE}% | ${TARGET_BRANCH_COVERAGE}% | ${TARGET_FUNCTION_COVERAGE}% |

          ## Quality Gate Status

          ✅ All minimum coverage thresholds met

          ---
          *Generated by BIZRA Genesis Node CI/CD Pipeline*
          EOF

          cat evidence/coverage-trend.md

  # ═══════════════════════════════════════════════════════════════════════════
  # Test Health Metrics
  # ═══════════════════════════════════════════════════════════════════════════
  test-health:
    name: Test Health Metrics
    runs-on: ubuntu-latest
    needs: [rust-coverage]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run test suite with timing
        run: |
          cargo nextest run \
            --all-features \
            --profile ci \
            --message-format json-pretty > test-results.json 2>&1 || true

      - name: Analyze test health
        run: |
          # Count tests
          TOTAL_TESTS=$(grep -c '"type":"test"' test-results.json 2>/dev/null || echo "0")
          PASSED_TESTS=$(grep -c '"status":"passed"' test-results.json 2>/dev/null || echo "0")
          FAILED_TESTS=$(grep -c '"status":"failed"' test-results.json 2>/dev/null || echo "0")
          SKIPPED_TESTS=$(grep -c '"status":"skipped"' test-results.json 2>/dev/null || echo "0")

          echo "📊 Test Health Metrics:"
          echo "  Total Tests: $TOTAL_TESTS"
          echo "  Passed: $PASSED_TESTS"
          echo "  Failed: $FAILED_TESTS"
          echo "  Skipped: $SKIPPED_TESTS"

          # Calculate pass rate
          if [ "$TOTAL_TESTS" -gt 0 ]; then
            PASS_RATE=$(echo "scale=2; $PASSED_TESTS * 100 / $TOTAL_TESTS" | bc)
            echo "  Pass Rate: ${PASS_RATE}%"

            if (( $(echo "$PASS_RATE < 95" | bc -l) )); then
              echo "::warning::Test pass rate ${PASS_RATE}% is below 95% target"
            fi
          fi

      - name: Check for flaky tests
        run: |
          echo "🔍 Checking for flaky tests..."

          # Run tests multiple times to detect flakiness
          FLAKY_FOUND=0

          for i in 1 2 3; do
            echo "Run $i..."
            cargo test --all-features -- --test-threads=1 2>&1 | tee "run-$i.log" || true
          done

          # Compare results (simplified - a real implementation would be more sophisticated)
          if ! diff -q run-1.log run-2.log > /dev/null 2>&1; then
            echo "::warning::Potential flaky tests detected - results differ between runs"
            FLAKY_FOUND=1
          fi

          if [ "$FLAKY_FOUND" -eq 1 ]; then
            echo "⚠️ Flaky tests may exist - consider investigating"
          else
            echo "✅ No obvious flaky tests detected"
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Final Quality Gate
  # ═══════════════════════════════════════════════════════════════════════════
  final-gate:
    name: Final Quality Gate
    runs-on: ubuntu-latest
    needs: [rust-coverage, frontend-coverage, test-health]
    if: always()
    steps:
      - name: Evaluate Quality Gates
        run: |
          echo "🏁 Final Quality Gate Evaluation"
          echo "================================"

          RUST_RESULT="${{ needs.rust-coverage.result }}"
          FRONTEND_RESULT="${{ needs.frontend-coverage.result }}"
          TEST_HEALTH_RESULT="${{ needs.test-health.result }}"

          ALL_PASSED=true

          if [ "$RUST_RESULT" != "success" ]; then
            echo "❌ Rust coverage gate: $RUST_RESULT"
            ALL_PASSED=false
          else
            echo "✅ Rust coverage gate: passed"
          fi

          if [ "$FRONTEND_RESULT" = "failure" ]; then
            echo "⚠️ Frontend coverage gate: $FRONTEND_RESULT (non-blocking)"
          else
            echo "✅ Frontend coverage gate: passed"
          fi

          if [ "$TEST_HEALTH_RESULT" != "success" ]; then
            echo "⚠️ Test health check: $TEST_HEALTH_RESULT (non-blocking)"
          else
            echo "✅ Test health check: passed"
          fi

          echo ""

          if [ "$ALL_PASSED" = "true" ]; then
            echo "🎉 All critical quality gates passed!"
            echo "✅ Code is ready for merge"
          else
            echo "❌ Quality gates failed - merge blocked"
            exit 1
          fi
