# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  BIZRA GENESIS NODE - PROFESSIONAL ELITE SECURITY TEST PIPELINE          ║
# ║  Phase 6: DevOps & CI/CD Hardening                                        ║
# ║                                                                           ║
# ║  Compliance Coverage:                                                     ║
# ║  - SOC 2 CC6.1, CC6.3, CC7.2: Access Control, Monitoring                 ║
# ║  - PCI DSS 6.5.10, 10.7: Security Testing, Audit Trails                  ║
# ║  - ISO 27001 A.12.4.1: Event Logging                                      ║
# ║  - OWASP Top 10: A01, A04, A05, A09                                       ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: Professional Elite Security Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: 'Run full security test suite'
        required: false
        default: 'true'
        type: boolean
      generate_evidence:
        description: 'Generate compliance evidence'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_OFFLINE: "true"
  # ═══════════════════════════════════════════════════════════════════════════
  # PROFESSIONAL ELITE SECURITY TEST BASELINE
  # These counts MUST NOT decrease - enforced as quality gates
  # ═══════════════════════════════════════════════════════════════════════════
  PHASE_2_MIN_TESTS: 71    # Secrets/KMS Integration
  PHASE_3_MIN_TESTS: 81    # Middleware Security (RBAC + Circuit Breaker)
  PHASE_4_MIN_TESTS: 60    # POI Rewards API
  PHASE_5_MIN_TESTS: 43    # Telemetry & Observability
  TOTAL_MIN_TESTS: 255     # Total Professional Elite Security Tests

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 2: Secrets/KMS Integration Tests (71 tests)
  # SOC 2 CC6.1 - Logical Access Controls
  # ═══════════════════════════════════════════════════════════════════════════
  phase-2-secrets-kms:
    name: "Phase 2: Secrets/KMS (71 tests)"
    runs-on: ubuntu-latest
    outputs:
      test_count: ${{ steps.run-tests.outputs.test_count }}
      passed: ${{ steps.run-tests.outputs.passed }}
      failed: ${{ steps.run-tests.outputs.failed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Secrets/KMS Integration Tests
        id: run-tests
        run: |
          echo "🔐 Running Phase 2: Secrets/KMS Integration Tests..."

          # Run tests and capture output
          OUTPUT=$(cargo test --test secrets_kms_integration 2>&1)
          echo "$OUTPUT"

          # Parse test results
          PASSED=$(echo "$OUTPUT" | grep -oP '\d+(?= passed)' | tail -1 || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+(?= failed)' | tail -1 || echo "0")
          IGNORED=$(echo "$OUTPUT" | grep -oP '\d+(?= ignored)' | tail -1 || echo "0")

          TOTAL=$((PASSED + FAILED))

          echo "test_count=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "ignored=$IGNORED" >> $GITHUB_OUTPUT

          echo ""
          echo "📊 Phase 2 Results:"
          echo "  Passed: $PASSED"
          echo "  Failed: $FAILED"
          echo "  Ignored: $IGNORED"
          echo "  Total: $TOTAL (Minimum required: $PHASE_2_MIN_TESTS)"

          # Enforce test count
          if [ "$TOTAL" -lt "$PHASE_2_MIN_TESTS" ]; then
            echo "❌ ERROR: Test count ($TOTAL) below minimum ($PHASE_2_MIN_TESTS)"
            exit 1
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ ERROR: $FAILED tests failed"
            exit 1
          fi

          echo "✅ Phase 2: Secrets/KMS tests PASSED"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 3a: Circuit Breaker Tests (41 tests)
  # SOC 2 CC7.2 - System Monitoring
  # ═══════════════════════════════════════════════════════════════════════════
  phase-3a-circuit-breaker:
    name: "Phase 3a: Circuit Breaker (41 tests)"
    runs-on: ubuntu-latest
    outputs:
      test_count: ${{ steps.run-tests.outputs.test_count }}
      passed: ${{ steps.run-tests.outputs.passed }}
      failed: ${{ steps.run-tests.outputs.failed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Circuit Breaker Tests
        id: run-tests
        run: |
          echo "⚡ Running Phase 3a: Circuit Breaker Tests..."

          OUTPUT=$(cargo test --test circuit_breaker_tests 2>&1)
          echo "$OUTPUT"

          PASSED=$(echo "$OUTPUT" | grep -oP '\d+(?= passed)' | tail -1 || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+(?= failed)' | tail -1 || echo "0")
          IGNORED=$(echo "$OUTPUT" | grep -oP '\d+(?= ignored)' | tail -1 || echo "0")

          TOTAL=$((PASSED + IGNORED))  # Circuit breaker has 2 timing-sensitive ignored tests

          echo "test_count=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          echo ""
          echo "📊 Phase 3a Results:"
          echo "  Passed: $PASSED"
          echo "  Failed: $FAILED"
          echo "  Ignored: $IGNORED (timing-sensitive)"

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ ERROR: $FAILED tests failed"
            exit 1
          fi

          echo "✅ Phase 3a: Circuit Breaker tests PASSED"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 3b: RBAC Middleware Tests (40 tests)
  # SOC 2 CC6.3 - Role-Based Access Control
  # ═══════════════════════════════════════════════════════════════════════════
  phase-3b-rbac:
    name: "Phase 3b: RBAC Middleware (40 tests)"
    runs-on: ubuntu-latest
    outputs:
      test_count: ${{ steps.run-tests.outputs.test_count }}
      passed: ${{ steps.run-tests.outputs.passed }}
      failed: ${{ steps.run-tests.outputs.failed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run RBAC Middleware Tests
        id: run-tests
        run: |
          echo "🔐 Running Phase 3b: RBAC Middleware Tests..."

          OUTPUT=$(cargo test --test middleware_tests rbac 2>&1 || cargo test rbac:: 2>&1)
          echo "$OUTPUT"

          PASSED=$(echo "$OUTPUT" | grep -oP '\d+(?= passed)' | tail -1 || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+(?= failed)' | tail -1 || echo "0")

          echo "test_count=$PASSED" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          echo ""
          echo "📊 Phase 3b Results:"
          echo "  Passed: $PASSED"
          echo "  Failed: $FAILED"

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ ERROR: $FAILED tests failed"
            exit 1
          fi

          echo "✅ Phase 3b: RBAC tests PASSED"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 4: POI Rewards API Tests (60 tests)
  # PCI DSS 6.5.10 - Secure Payment Processing
  # ═══════════════════════════════════════════════════════════════════════════
  phase-4-poi-rewards:
    name: "Phase 4: POI Rewards API (60 tests)"
    runs-on: ubuntu-latest
    outputs:
      test_count: ${{ steps.run-tests.outputs.test_count }}
      passed: ${{ steps.run-tests.outputs.passed }}
      failed: ${{ steps.run-tests.outputs.failed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run POI Rewards API Tests
        id: run-tests
        run: |
          echo "💰 Running Phase 4: POI Rewards API Tests..."

          OUTPUT=$(cargo test --test poi_rewards_api_tests 2>&1)
          echo "$OUTPUT"

          PASSED=$(echo "$OUTPUT" | grep -oP '\d+(?= passed)' | tail -1 || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+(?= failed)' | tail -1 || echo "0")

          echo "test_count=$PASSED" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          echo ""
          echo "📊 Phase 4 Results:"
          echo "  Passed: $PASSED"
          echo "  Failed: $FAILED"
          echo "  Minimum required: $PHASE_4_MIN_TESTS"

          if [ "$PASSED" -lt "$PHASE_4_MIN_TESTS" ]; then
            echo "❌ ERROR: Test count ($PASSED) below minimum ($PHASE_4_MIN_TESTS)"
            exit 1
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ ERROR: $FAILED tests failed"
            exit 1
          fi

          echo "✅ Phase 4: POI Rewards API tests PASSED"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 5: Telemetry & Observability Tests (43 tests)
  # SOC 2 CC7.2 - System Monitoring
  # ═══════════════════════════════════════════════════════════════════════════
  phase-5-telemetry:
    name: "Phase 5: Telemetry (43 tests)"
    runs-on: ubuntu-latest
    outputs:
      test_count: ${{ steps.run-tests.outputs.test_count }}
      passed: ${{ steps.run-tests.outputs.passed }}
      failed: ${{ steps.run-tests.outputs.failed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Telemetry & Observability Tests
        id: run-tests
        run: |
          echo "📊 Running Phase 5: Telemetry & Observability Tests..."

          OUTPUT=$(cargo test --test telemetry_observability_tests 2>&1)
          echo "$OUTPUT"

          PASSED=$(echo "$OUTPUT" | grep -oP '\d+(?= passed)' | tail -1 || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+(?= failed)' | tail -1 || echo "0")

          echo "test_count=$PASSED" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          echo ""
          echo "📊 Phase 5 Results:"
          echo "  Passed: $PASSED"
          echo "  Failed: $FAILED"
          echo "  Minimum required: $PHASE_5_MIN_TESTS"

          if [ "$PASSED" -lt "$PHASE_5_MIN_TESTS" ]; then
            echo "❌ ERROR: Test count ($PASSED) below minimum ($PHASE_5_MIN_TESTS)"
            exit 1
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ ERROR: $FAILED tests failed"
            exit 1
          fi

          echo "✅ Phase 5: Telemetry & Observability tests PASSED"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 4 Supporting: POI Rewards Logic Tests (36 tests)
  # ═══════════════════════════════════════════════════════════════════════════
  phase-4-poi-logic:
    name: "Phase 4 Supporting: POI Logic (36 tests)"
    runs-on: ubuntu-latest
    outputs:
      test_count: ${{ steps.run-tests.outputs.test_count }}
      passed: ${{ steps.run-tests.outputs.passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run POI Rewards Logic Tests
        id: run-tests
        run: |
          echo "🧮 Running POI Rewards Logic Tests..."

          OUTPUT=$(cargo test --test poi_rewards_tests 2>&1)
          echo "$OUTPUT"

          PASSED=$(echo "$OUTPUT" | grep -oP '\d+(?= passed)' | tail -1 || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+(?= failed)' | tail -1 || echo "0")

          echo "test_count=$PASSED" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ ERROR: $FAILED tests failed"
            exit 1
          fi

          echo "✅ POI Rewards Logic tests PASSED"

  # ═══════════════════════════════════════════════════════════════════════════
  # PROFESSIONAL ELITE SECURITY QUALITY GATE
  # Enforces minimum test counts and generates compliance evidence
  # ═══════════════════════════════════════════════════════════════════════════
  security-quality-gate:
    name: "Security Quality Gate"
    runs-on: ubuntu-latest
    needs:
      - phase-2-secrets-kms
      - phase-3a-circuit-breaker
      - phase-3b-rbac
      - phase-4-poi-rewards
      - phase-5-telemetry
      - phase-4-poi-logic
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Aggregate Test Results
        id: aggregate
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════════════╗"
          echo "║  PROFESSIONAL ELITE SECURITY TEST RESULTS                                 ║"
          echo "╚═══════════════════════════════════════════════════════════════════════════╝"
          echo ""

          # Collect results from all phases
          P2_PASSED="${{ needs.phase-2-secrets-kms.outputs.passed || '0' }}"
          P3A_PASSED="${{ needs.phase-3a-circuit-breaker.outputs.passed || '0' }}"
          P3B_PASSED="${{ needs.phase-3b-rbac.outputs.passed || '0' }}"
          P4_PASSED="${{ needs.phase-4-poi-rewards.outputs.passed || '0' }}"
          P5_PASSED="${{ needs.phase-5-telemetry.outputs.passed || '0' }}"
          P4_LOGIC="${{ needs.phase-4-poi-logic.outputs.passed || '0' }}"

          # Calculate totals
          PHASE_3_TOTAL=$((P3A_PASSED + P3B_PASSED))
          TOTAL_PASSED=$((P2_PASSED + PHASE_3_TOTAL + P4_PASSED + P5_PASSED + P4_LOGIC))

          echo "📊 Test Results Summary:"
          echo "╠═══════════════════════════════════════════════════════════════════════════╣"
          echo "║ Phase 2: Secrets/KMS Integration     │ $P2_PASSED passed                  "
          echo "║ Phase 3a: Circuit Breaker            │ $P3A_PASSED passed                 "
          echo "║ Phase 3b: RBAC Middleware            │ $P3B_PASSED passed                 "
          echo "║ Phase 4: POI Rewards API             │ $P4_PASSED passed                  "
          echo "║ Phase 4: POI Rewards Logic           │ $P4_LOGIC passed                   "
          echo "║ Phase 5: Telemetry & Observability   │ $P5_PASSED passed                  "
          echo "╠═══════════════════════════════════════════════════════════════════════════╣"
          echo "║ TOTAL                                │ $TOTAL_PASSED passed               "
          echo "║ MINIMUM REQUIRED                     │ $TOTAL_MIN_TESTS tests             "
          echo "╚═══════════════════════════════════════════════════════════════════════════╝"

          echo "total_passed=$TOTAL_PASSED" >> $GITHUB_OUTPUT
          echo "p2_passed=$P2_PASSED" >> $GITHUB_OUTPUT
          echo "p3a_passed=$P3A_PASSED" >> $GITHUB_OUTPUT
          echo "p3b_passed=$P3B_PASSED" >> $GITHUB_OUTPUT
          echo "p4_passed=$P4_PASSED" >> $GITHUB_OUTPUT
          echo "p5_passed=$P5_PASSED" >> $GITHUB_OUTPUT
          echo "p4_logic=$P4_LOGIC" >> $GITHUB_OUTPUT

      - name: Enforce Test Count Gate
        run: |
          TOTAL="${{ steps.aggregate.outputs.total_passed }}"

          if [ "$TOTAL" -lt "$TOTAL_MIN_TESTS" ]; then
            echo "❌ QUALITY GATE FAILED"
            echo "Total tests ($TOTAL) below minimum required ($TOTAL_MIN_TESTS)"
            echo ""
            echo "This indicates test regression. Review and restore missing tests."
            exit 1
          fi

          echo "✅ Test count gate PASSED ($TOTAL >= $TOTAL_MIN_TESTS)"

      - name: Check Phase Results
        run: |
          # Check all phases completed successfully
          P2_RESULT="${{ needs.phase-2-secrets-kms.result }}"
          P3A_RESULT="${{ needs.phase-3a-circuit-breaker.result }}"
          P3B_RESULT="${{ needs.phase-3b-rbac.result }}"
          P4_RESULT="${{ needs.phase-4-poi-rewards.result }}"
          P5_RESULT="${{ needs.phase-5-telemetry.result }}"
          P4L_RESULT="${{ needs.phase-4-poi-logic.result }}"

          ALL_PASSED=true

          echo "Phase Results:"
          echo "  Phase 2 (Secrets/KMS): $P2_RESULT"
          echo "  Phase 3a (Circuit Breaker): $P3A_RESULT"
          echo "  Phase 3b (RBAC): $P3B_RESULT"
          echo "  Phase 4 (POI API): $P4_RESULT"
          echo "  Phase 4 (POI Logic): $P4L_RESULT"
          echo "  Phase 5 (Telemetry): $P5_RESULT"

          for result in "$P2_RESULT" "$P3A_RESULT" "$P3B_RESULT" "$P4_RESULT" "$P4L_RESULT" "$P5_RESULT"; do
            if [ "$result" != "success" ]; then
              ALL_PASSED=false
            fi
          done

          if [ "$ALL_PASSED" = "false" ]; then
            echo ""
            echo "❌ SECURITY QUALITY GATE FAILED"
            echo "One or more security test phases did not pass."
            exit 1
          fi

          echo ""
          echo "✅ ALL SECURITY TEST PHASES PASSED"

      - name: Generate Compliance Evidence
        if: success()
        run: |
          mkdir -p evidence

          cat > evidence/professional-elite-security-evidence.md << EOF
          # Professional Elite Security Test Evidence

          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Workflow Run:** ${{ github.run_id }}

          ## Test Suite Summary

          | Phase | Module | Tests Passed | Status |
          |-------|--------|--------------|--------|
          | Phase 2 | Secrets/KMS Integration | ${{ steps.aggregate.outputs.p2_passed }} | ✅ |
          | Phase 3a | Circuit Breaker | ${{ steps.aggregate.outputs.p3a_passed }} | ✅ |
          | Phase 3b | RBAC Middleware | ${{ steps.aggregate.outputs.p3b_passed }} | ✅ |
          | Phase 4 | POI Rewards API | ${{ steps.aggregate.outputs.p4_passed }} | ✅ |
          | Phase 4 | POI Rewards Logic | ${{ steps.aggregate.outputs.p4_logic }} | ✅ |
          | Phase 5 | Telemetry & Observability | ${{ steps.aggregate.outputs.p5_passed }} | ✅ |
          | **TOTAL** | | **${{ steps.aggregate.outputs.total_passed }}** | ✅ |

          ## Compliance Framework Coverage

          ### SOC 2 Type II
          - **CC6.1** - Logical and Physical Access Controls
            - Validated by: Phase 2 (Secrets/KMS), Phase 3b (RBAC)
          - **CC6.3** - Role-Based Access Control
            - Validated by: Phase 3b (RBAC Middleware - 40 tests)
          - **CC7.2** - System Monitoring and Incident Detection
            - Validated by: Phase 3a (Circuit Breaker), Phase 5 (Telemetry)

          ### PCI DSS v4.0
          - **6.5.10** - Secure Coding Practices
            - Validated by: All phases - cryptographic verification, input validation
          - **10.7** - Audit Trail History
            - Validated by: Phase 5 (Telemetry & Observability - 43 tests)

          ### ISO 27001:2022
          - **A.12.4.1** - Event Logging
            - Validated by: Phase 5 (Telemetry) - SLO monitoring, metrics collection

          ### OWASP Top 10 (2021)
          - **A01:2021** - Broken Access Control
            - Validated by: Phase 3b (RBAC - privilege escalation prevention)
          - **A04:2021** - Insecure Design
            - Validated by: Phase 2 (KMS), Phase 4 (Settlement state machine)
          - **A05:2021** - Security Misconfiguration
            - Validated by: Phase 3a (Circuit breaker config validation)
          - **A09:2021** - Security Logging & Monitoring Failures
            - Validated by: Phase 5 (Telemetry - comprehensive observability)

          ## Quality Gate Status

          - ✅ Test Count Gate: ${{ steps.aggregate.outputs.total_passed }} >= ${TOTAL_MIN_TESTS}
          - ✅ All Phases Passed: 6/6
          - ✅ No Test Failures: 0 failed
          - ✅ Compliance Evidence Generated

          ## Verification

          This evidence document confirms that the BIZRA Genesis Node has been validated
          against ${{ steps.aggregate.outputs.total_passed }} security tests covering:

          - Cryptographic operations (Ed25519, BLAKE3, AES-256-GCM)
          - Access control (RBAC with 7 roles, 20 permissions)
          - Resilience patterns (Circuit breaker with configurable thresholds)
          - Financial operations (POI rewards distribution, settlement state machine)
          - Observability (SLO evaluation, β-11 Flight Rules compliance)

          ---
          *Professional Elite Security Foundation - Automated CI/CD Evidence*
          *Generated by BIZRA Genesis Node Pipeline v1.0*
          EOF

          cat evidence/professional-elite-security-evidence.md

      - name: Upload Compliance Evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: security-compliance-evidence
          path: evidence/professional-elite-security-evidence.md
          retention-days: 90

      - name: Generate Summary
        if: always()
        run: |
          echo "## 🔐 Professional Elite Security Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Tests | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 2: Secrets/KMS | ${{ steps.aggregate.outputs.p2_passed }} | ${{ needs.phase-2-secrets-kms.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 3a: Circuit Breaker | ${{ steps.aggregate.outputs.p3a_passed }} | ${{ needs.phase-3a-circuit-breaker.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 3b: RBAC | ${{ steps.aggregate.outputs.p3b_passed }} | ${{ needs.phase-3b-rbac.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 4: POI API | ${{ steps.aggregate.outputs.p4_passed }} | ${{ needs.phase-4-poi-rewards.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 4: POI Logic | ${{ steps.aggregate.outputs.p4_logic }} | ${{ needs.phase-4-poi-logic.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 5: Telemetry | ${{ steps.aggregate.outputs.p5_passed }} | ${{ needs.phase-5-telemetry.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **TOTAL** | **${{ steps.aggregate.outputs.total_passed }}** | |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Minimum Required:** $TOTAL_MIN_TESTS tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.phase-2-secrets-kms.result }}" = "success" ] && \
             [ "${{ needs.phase-3a-circuit-breaker.result }}" = "success" ] && \
             [ "${{ needs.phase-3b-rbac.result }}" = "success" ] && \
             [ "${{ needs.phase-4-poi-rewards.result }}" = "success" ] && \
             [ "${{ needs.phase-5-telemetry.result }}" = "success" ]; then
            echo "### ✅ Security Quality Gate: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Security Quality Gate: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # PR Comment with Security Test Results
  # ═══════════════════════════════════════════════════════════════════════════
  pr-comment:
    name: "PR Security Report"
    runs-on: ubuntu-latest
    needs: [security-quality-gate]
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.security-quality-gate.result }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';

            const body = `## ${icon} Professional Elite Security Tests: ${status}

