# BIZRA Node0 - Automated Release Pipeline
# Elite Release Automation with Semantic Versioning & Changelog Generation
# Professional Standard: Zero-touch releases with full traceability

name: 🚀 Release Automation

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================
  # SEMANTIC RELEASE ANALYSIS
  # ============================================
  analyze:
    name: 📊 Analyze Commits
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.semantic.outputs.new_release_published }}
      new_version: ${{ steps.semantic.outputs.new_release_version }}
      changelog: ${{ steps.semantic.outputs.new_release_notes }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install semantic-release
        run: |
          npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github @semantic-release/exec conventional-changelog-conventionalcommits

      - name: 📊 Semantic Release (Dry Run)
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run | tee release-output.txt
          
          if grep -q "Published release" release-output.txt; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            VERSION=$(grep -oP "Published release \K[0-9]+\.[0-9]+\.[0-9]+" release-output.txt || echo "")
            echo "new_release_version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # BUILD RELEASE ARTIFACTS
  # ============================================
  build-release:
    name: 🔨 Build Release Artifacts
    needs: analyze
    if: needs.analyze.outputs.release_needed == 'true' || github.event.inputs.release_type != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: bizra-api-linux-amd64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: bizra-api-linux-musl
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 📦 Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: release-${{ matrix.target }}

      - name: 🔨 Build Release Binary
        working-directory: backend
        run: |
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/apiserver ../${{ matrix.artifact }}

      - name: 📦 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 5

  # ============================================
  # BUILD DOCKER IMAGES
  # ============================================
  docker-release:
    name: 🐳 Build Release Images
    needs: [analyze, build-release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend
            image: bizra-api
          - context: apps/dashboard
            image: bizra-dashboard
          - context: bridge
            image: bizra-bridge
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.analyze.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.analyze.outputs.new_version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🐳 Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ============================================
  # CREATE GITHUB RELEASE
  # ============================================
  release:
    name: 📦 Create Release
    needs: [analyze, build-release, docker-release]
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📦 Package Artifacts
        run: |
          mkdir -p release-assets
          
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            tar -czvf "release-assets/${name}.tar.gz" -C "$dir" .
          done

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github

      - name: 🚀 Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: 📤 Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: needs.analyze.outputs.new_version != ''
        with:
          tag_name: v${{ needs.analyze.outputs.new_version }}
          files: release-assets/*
          generate_release_notes: true

  # ============================================
  # POST-RELEASE NOTIFICATIONS
  # ============================================
  notify:
    name: 📢 Notify Release
    needs: release
    runs-on: ubuntu-latest
    
    steps:
      - name: 📢 Discord Notification
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🚀 BIZRA Node0 Release",
                "description": "Version ${{ needs.analyze.outputs.new_version }} has been released!",
                "color": 15105570,
                "fields": [
                  {"name": "Version", "value": "${{ needs.analyze.outputs.new_version }}", "inline": true},
                  {"name": "Status", "value": "✅ Published", "inline": true}
                ]
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK }}
