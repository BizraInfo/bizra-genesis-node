# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  BIZRA GENESIS NODE - NGINX REVERSE PROXY CONFIGURATION                  ║
# ║  Production-grade TLS termination with security hardening                ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# User and worker configuration
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load dynamic modules
load_module modules/ngx_http_headers_more_filter_module.so;

# Events block
events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

# HTTP block
http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format (JSON structured logging for observability)
    log_format json_combined escape=json
    '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # Performance optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer sizes (prevent buffer overflow attacks)
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 4 8k;

    # Timeouts (prevent slowloris attacks)
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream backend (API server)
    upstream bizra_backend {
        server api_server:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # WebSocket upstream
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ═══════════════════════════════════════════════════════════════════════
    # HTTP SERVER (Port 80) - Redirect to HTTPS
    # ═══════════════════════════════════════════════════════════════════════

    server {
        listen 80;
        listen [::]:80;
        server_name console.bizra.ai;

        # ACME challenge for Let's Encrypt (HTTP-01)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # HTTPS SERVER (Port 443) - Main application
    # ═══════════════════════════════════════════════════════════════════════

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name console.bizra.ai;

        # ═══════════════════════════════════════════════════════════════════
        # TLS/SSL CONFIGURATION
        # ═══════════════════════════════════════════════════════════════════

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/console.bizra.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/console.bizra.ai/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/console.bizra.ai/chain.pem;

        # SSL session configuration
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Diffie-Hellman parameter for DHE ciphersuites
        ssl_dhparam /etc/nginx/ssl/dhparam.pem;

        # TLS protocol versions (TLS 1.2 and 1.3 only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ═══════════════════════════════════════════════════════════════════
        # SECURITY HEADERS
        # ═══════════════════════════════════════════════════════════════════

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://console.bizra.ai; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # XSS Protection
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions Policy
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Remove server header
        more_clear_headers Server;

        # ═══════════════════════════════════════════════════════════════════
        # LOCATIONS
        # ═══════════════════════════════════════════════════════════════════

        # Root location (API endpoints)
        location / {
            # Rate limiting
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;

            # Proxy settings
            proxy_pass http://bizra_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Disable proxy redirect
            proxy_redirect off;
        }

        # Authentication endpoints (stricter rate limiting)
        location ~ ^/auth/(register|login|refresh) {
            # Stricter rate limiting for auth endpoints
            limit_req zone=auth_limit burst=3 nodelay;
            limit_conn conn_limit 5;

            # Proxy to backend
            proxy_pass http://bizra_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://bizra_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off; # Don't log health checks
        }

        # WebSocket endpoint
        location /ws {
            # Rate limiting
            limit_req zone=api_limit burst=5 nodelay;
            limit_conn conn_limit 50;

            # Proxy settings for WebSocket
            proxy_pass http://bizra_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts (longer for persistent connections)
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # Disable buffering for WebSocket
            proxy_buffering off;
        }

        # Prometheus metrics endpoint (internal only)
        location /metrics {
            # Restrict to internal network only
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://bizra_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Static assets (if any)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;

            proxy_pass http://bizra_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # ADDITIONAL CONFIGURATION
    # ═══════════════════════════════════════════════════════════════════════

    # Include additional server configs
    include /etc/nginx/conf.d/*.conf;
}
